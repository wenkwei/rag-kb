<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业知识库 - 新建对话</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-up {
            animation: slideInUp 0.6s ease-out forwards;
        }
    </style>
</head>
<body class="bg-[#f7f9fc] text-[#333] overflow-hidden">
    <div class="flex h-screen w-full">
        <!-- 左侧边栏 -->
        <aside class="w-64 bg-white border-r border-gray-100 flex flex-col shrink-0">
            <div class="p-4 flex items-center gap-2 border-b border-gray-50">
                <div class="bg-blue-600 p-1.5 rounded-lg">
                    <i data-lucide="message-square" class="text-white w-5 h-5"></i>
                </div>
                <h1 class="text-lg font-bold text-gray-800">企业知识库</h1>
            </div>

            <div class="flex-1 overflow-y-auto px-3 py-4 custom-scrollbar">
                <div class="text-xs font-semibold text-gray-400 mb-4 px-2 uppercase tracking-wider">对话历史</div>
                
                <!-- 历史项目 1 (激活) -->
                <div class="group flex flex-col p-3 rounded-xl cursor-pointer transition-all mb-2 bg-blue-50 border border-blue-100 shadow-sm">
                    <div class="text-sm font-medium mb-1 text-blue-700">关于2024年市场增长率的咨询</div>
                    <div class="text-xs text-gray-400 flex items-center gap-1">
                        <div class="w-1.5 h-1.5 bg-blue-500 rounded-full animate-pulse"></div>
                        正在对话
                    </div>
                </div>

                <!-- 历史项目 2 -->
                <div class="group flex flex-col p-3 rounded-xl cursor-pointer transition-all mb-2 hover:bg-gray-50 border border-transparent">
                    <div class="text-sm font-medium mb-1 text-gray-700">如何申请年假流程说明</div>
                    <div class="text-xs text-gray-400">1小时前</div>
                </div>

                <!-- 历史项目 3 -->
                <div class="group flex flex-col p-3 rounded-xl cursor-pointer transition-all mb-2 hover:bg-gray-50 border border-transparent">
                    <div class="text-sm font-medium mb-1 text-gray-700">办公网络连接异常排查指南</div>
                    <div class="text-xs text-gray-400">昨天</div>
                </div>
            </div>

            <div class="p-4 border-t border-gray-50">
                <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-blue-200 transition-all active:scale-95">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                    <span>新建对话</span>
                </button>
            </div>
        </aside>

        <!-- 主对话区 -->
        <main class="flex-1 flex flex-col relative overflow-hidden">
            <!-- 顶部导航 -->
            <header class="h-16 flex items-center justify-end px-6 gap-6 bg-white/50 backdrop-blur-sm z-10 shrink-0">
                <button class="flex items-center gap-1.5 text-gray-500 hover:text-blue-600 transition-colors">
                    <i data-lucide="bookmark" class="w-4.5 h-4.5"></i>
                    <span class="text-sm">我的收藏</span>
                </button>
                <div class="relative cursor-pointer group">
                    <i data-lucide="bell" class="w-4.5 h-4.5 text-gray-500 group-hover:text-blue-600 transition-colors"></i>
                    <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
                </div>
                <div class="flex items-center gap-2 pl-4 border-l border-gray-200">
                    <div class="text-right">
                        <div class="text-sm font-semibold text-gray-800">张小明</div>
                        <div class="text-[10px] text-gray-400">产品中心</div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center overflow-hidden border border-blue-200">
                        <i data-lucide="user" class="text-blue-600 w-4.5 h-4.5"></i>
                    </div>
                </div>
            </header>

            <!-- 内容区域 -->
            <div class="flex-1 overflow-y-auto p-8 flex flex-col items-center justify-center custom-scrollbar">
                <div class="max-w-2xl w-full text-center space-y-8 animate-up">
                    <div>
                        <div class="inline-flex p-4 rounded-3xl bg-blue-50 text-blue-600 mb-6 shadow-sm border border-blue-100">
                            <i data-lucide="message-square" class="w-12 h-12"></i>
                        </div>
                        <h2 class="text-3xl font-bold text-gray-800 mb-3">下午好，小明</h2>
                        <p class="text-gray-500 text-lg">我是企业智能助手，已为您整理好最新的政策与文档。今天有什么可以帮您的？</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-left">
                        <button class="p-4 bg-white border border-gray-100 rounded-2xl hover:border-blue-300 hover:shadow-md transition-all group flex items-start gap-3">
                            <div class="p-2 bg-gray-50 rounded-lg group-hover:bg-blue-50 transition-colors">
                                <i data-lucide="file-text" class="w-5 h-5 text-blue-500"></i>
                            </div>
                            <div class="text-sm font-medium text-gray-700 leading-snug group-hover:text-blue-700">查询公司最新的远程办公政策</div>
                        </button>
                        <button class="p-4 bg-white border border-gray-100 rounded-2xl hover:border-blue-300 hover:shadow-md transition-all group flex items-start gap-3">
                            <div class="p-2 bg-gray-50 rounded-lg group-hover:bg-blue-50 transition-colors">
                                <i data-lucide="zap" class="w-5 h-5 text-orange-500"></i>
                            </div>
                            <div class="text-sm font-medium text-gray-700 leading-snug group-hover:text-blue-700">如何快速申请新的办公笔记本？</div>
                        </button>
                        <button class="p-4 bg-white border border-gray-100 rounded-2xl hover:border-blue-300 hover:shadow-md transition-all group flex items-start gap-3">
                            <div class="p-2 bg-gray-50 rounded-lg group-hover:bg-blue-50 transition-colors">
                                <i data-lucide="shield-check" class="w-5 h-5 text-green-500"></i>
                            </div>
                            <div class="text-sm font-medium text-gray-700 leading-snug group-hover:text-blue-700">2024年个人所得税专项扣除指引</div>
                        </button>
                        <button class="p-4 bg-white border border-gray-100 rounded-2xl hover:border-blue-300 hover:shadow-md transition-all group flex items-start gap-3">
                            <div class="p-2 bg-gray-50 rounded-lg group-hover:bg-blue-50 transition-colors">
                                <i data-lucide="globe" class="w-5 h-5 text-purple-500"></i>
                            </div>
                            <div class="text-sm font-medium text-gray-700 leading-snug group-hover:text-blue-700">公司在上海地区的各办事处地址</div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 输入框区域 -->
            <div class="p-8 pt-0 shrink-0">
                <div class="max-w-3xl mx-auto relative group">
                    <div class="absolute left-4 top-1/2 -translate-y-1/2 flex gap-3 text-gray-400">
                        <i data-lucide="plus" class="w-5 h-5 cursor-pointer hover:text-blue-600 transition-colors"></i>
                    </div>
                    <input 
                        type="text" 
                        id="chat-input"
                        placeholder="输入您的问题，如：如何报销出差交通费？"
                        class="w-full bg-white border border-gray-200 rounded-2xl py-4 pl-12 pr-24 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-all text-sm"
                    >
                    <button 
                        id="send-btn"
                        class="absolute right-2 top-1/2 -translate-y-1/2 px-5 py-2 rounded-xl flex items-center gap-1.5 transition-all bg-gray-100 text-gray-400"
                    >
                        <span class="text-sm font-medium">发送</span>
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                    <div class="mt-3 text-center">
                        <span class="text-[10px] text-gray-400">智能回答仅供参考，核心数据请以正式文档为准。</span>
                    </div>
                </div>
            </div>
        </main>

        <!-- 右侧面板 -->
        <aside class="w-72 bg-[#fcfdfe] border-l border-gray-100 p-5 space-y-8 hidden xl:flex flex-col overflow-y-auto custom-scrollbar shrink-0">
            <!-- 热门推荐 -->
            <section>
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-sm font-bold text-gray-800 flex items-center gap-2">
                        <i data-lucide="zap" class="w-4 h-4 text-orange-400"></i>
                        热门推荐
                    </h3>
                </div>
                <div class="flex flex-wrap gap-2">
                    <span class="px-3 py-1.5 bg-gray-50 text-gray-600 text-xs rounded-lg cursor-pointer hover:bg-blue-50 hover:text-blue-600 border border-gray-100 transition-colors"># 年假申请</span>
                    <span class="px-3 py-1.5 bg-gray-50 text-gray-600 text-xs rounded-lg cursor-pointer hover:bg-blue-50 hover:text-blue-600 border border-gray-100 transition-colors"># 差旅报销</span>
                    <span class="px-3 py-1.5 bg-gray-50 text-gray-600 text-xs rounded-lg cursor-pointer hover:bg-blue-50 hover:text-blue-600 border border-gray-100 transition-colors"># 会议室预定</span>
                    <span class="px-3 py-1.5 bg-gray-50 text-gray-600 text-xs rounded-lg cursor-pointer hover:bg-blue-50 hover:text-blue-600 border border-gray-100 transition-colors"># IT 支持</span>
                </div>
            </section>

            <!-- 我的收藏 -->
            <section>
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-sm font-bold text-gray-800 flex items-center gap-2">
                        <i data-lucide="bookmark" class="w-4 h-4 text-blue-500"></i>
                        我的收藏
                    </h3>
                    <button class="text-[10px] text-blue-500 hover:underline">查看全部</button>
                </div>
                <div class="space-y-3">
                    <div class="bg-white p-3 rounded-xl border border-gray-50 shadow-sm hover:shadow-md transition-shadow cursor-pointer">
                        <div class="text-xs font-medium text-gray-800 mb-1 line-clamp-1">2024年度大中华区核心战略规划文档</div>
                        <div class="flex items-center gap-2">
                            <span class="text-[9px] px-1 bg-red-50 text-red-500 rounded font-bold uppercase">PDF</span>
                            <span class="text-[10px] text-gray-400">更新于 2天前</span>
                        </div>
                    </div>
                    <div class="bg-white p-3 rounded-xl border border-gray-50 shadow-sm hover:shadow-md transition-shadow cursor-pointer">
                        <div class="text-xs font-medium text-gray-800 mb-1 line-clamp-1">员工差旅补助及报销细则</div>
                        <div class="flex items-center gap-2">
                            <span class="text-[9px] px-1 bg-blue-50 text-blue-500 rounded font-bold uppercase">DOC</span>
                            <span class="text-[10px] text-gray-400">更新于 3月15日</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 客服卡片 -->
            <section class="bg-slate-900 rounded-2xl p-5 relative overflow-hidden group shadow-xl mt-auto">
                <div class="relative z-10">
                    <h4 class="text-white font-medium mb-1 text-sm">遇到问题？</h4>
                    <p class="text-slate-400 text-[11px] mb-4">联系企业 IT 服务台</p>
                    <button class="w-full bg-white/10 hover:bg-white/20 text-white text-xs font-medium py-2.5 rounded-xl transition-all border border-white/10 backdrop-blur-md">
                        提交工单
                    </button>
                </div>
                <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-blue-600/20 rounded-full blur-2xl group-hover:scale-150 transition-transform duration-700"></div>
                <i data-lucide="help-circle" class="absolute right-3 top-3 text-white/5 w-16 h-16 group-hover:rotate-12 transition-transform"></i>
            </section>
        </aside>
    </div>

    <script>
        // 初始化图标
        lucide.createIcons();

        // 简单的输入框逻辑
        const input = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        input.addEventListener('input', (e) => {
            if (e.target.value.trim().length > 0) {
                sendBtn.classList.remove('bg-gray-100', 'text-gray-400');
                sendBtn.classList.add('bg-blue-600', 'text-white', 'shadow-md');
            } else {
                sendBtn.classList.add('bg-gray-100', 'text-gray-400');
                sendBtn.classList.remove('bg-blue-600', 'text-white', 'shadow-md');
            }
        });

        // 模拟发送点击
        sendBtn.addEventListener('click', () => {
            if (input.value.trim()) {
                console.log('发送消息:', input.value);
                input.value = '';
                sendBtn.classList.add('bg-gray-100', 'text-gray-400');
                sendBtn.classList.remove('bg-blue-600', 'text-white', 'shadow-md');
            }
        });
    </script>
</body>
</html>
