<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业知识库 - 系统配置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .nav-active { background-color: rgba(255, 255, 255, 0.1); color: #ffffff; border-left: 3px solid #3b82f6; }
        
        /* 标签页切换动画 */
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-btn.active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
    </style>
</head>
<body class="min-h-screen flex overflow-hidden">

    <!-- 左侧导航栏 -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 text-slate-300">
        <div class="h-14 flex items-center px-6 border-b border-slate-800 shrink-0">
            <div class="bg-blue-600 p-1.5 rounded-lg text-white mr-2">
                <i data-lucide="layout-dashboard" size="18"></i>
            </div>
            <span class="font-bold text-white tracking-tight">管理后台</span>
        </div>
        
        <nav class="flex-1 py-6">
            <div class="space-y-1">
                <a href="#" class="flex items-center gap-3 px-6 py-3 text-sm font-medium text-slate-400 hover:bg-white/5 hover:text-white transition-colors">
                    <i data-lucide="database" size="18"></i>
                    <span>知识库管理</span>
                </a>
                <a href="BadCaseManagement.html" class="flex items-center gap-3 px-6 py-3 text-sm font-medium text-slate-400 hover:bg-white/5 hover:text-white transition-colors">
                    <i data-lucide="alert-circle" size="18"></i>
                    <span>Bad Case 管理</span>
                </a>
                <a href="#" class="nav-active flex items-center gap-3 px-6 py-3 text-sm font-semibold transition-colors">
                    <i data-lucide="settings" size="18"></i>
                    <span>系统配置</span>
                </a>
            </div>
        </nav>
    </aside>

    <!-- 主体内容 -->
    <div class="flex-1 flex flex-col overflow-hidden relative">
        <header class="h-14 bg-white border-b border-slate-200 px-6 flex items-center justify-between z-20 shrink-0">
            <div class="flex items-center gap-4">
                <span class="font-semibold text-slate-800">系统配置</span>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-xs text-slate-400">上次同步: 12:40</span>
                <div class="w-8 h-8 rounded-full overflow-hidden border border-slate-200">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=momo" alt="Avatar" class="w-full h-full">
                </div>
            </div>
        </header>

        <!-- 标签页导航 -->
        <div class="bg-white px-6 border-b border-slate-200 shrink-0">
            <div class="flex gap-8">
                <button onclick="switchTab('users')" id="btn-users" class="tab-btn active py-4 text-sm font-bold text-slate-500 hover:text-slate-800 transition-all">用户管理</button>
                <button onclick="switchTab('roles')" id="btn-roles" class="tab-btn py-4 text-sm font-bold text-slate-500 hover:text-slate-800 transition-all">角色权限</button>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto custom-scrollbar p-6">
            
            <!-- 用户管理内容 -->
            <div id="tab-users" class="tab-content active space-y-6">
                <div class="flex items-center justify-between">
                    <div class="relative w-72">
                        <i data-lucide="search" class="absolute left-3 top-2.5 text-slate-400" size="16"></i>
                        <input type="text" placeholder="搜索用户名、邮箱..." class="w-full pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-500/10 focus:border-blue-500 transition-all">
                    </div>
                    <button class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 hover:bg-blue-700 shadow-md shadow-blue-500/10 transition-all">
                        <i data-lucide="plus" size="16"></i>
                        新增用户
                    </button>
                </div>

                <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-500 font-medium">
                            <tr>
                                <th class="px-6 py-4">用户信息</th>
                                <th class="px-4 py-4">分配角色</th>
                                <th class="px-4 py-4">状态</th>
                                <th class="px-4 py-4 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-slate-100">
                            <tr class="hover:bg-slate-50/50">
                                <td class="px-6 py-4 flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold text-xs">M</div>
                                    <div>
                                        <p class="font-bold text-slate-800">momo.zxy</p>
                                        <p class="text-xs text-slate-400">momo@company.com</p>
                                    </div>
                                </td>
                                <td class="px-4 py-4">
                                    <span class="px-2.5 py-1 bg-blue-50 text-blue-600 text-[11px] font-bold rounded-lg border border-blue-100">系统管理员</span>
                                </td>
                                <td class="px-4 py-4">
                                    <span class="inline-flex items-center gap-1.5 text-emerald-600 font-bold text-xs">
                                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                                        正常
                                    </span>
                                </td>
                                <td class="px-4 py-4 text-right">
                                    <div class="flex items-center justify-end gap-4">
                                        <button class="text-blue-600 hover:text-blue-800 font-bold">编辑</button>
                                        <button class="text-rose-500 hover:text-rose-700 font-bold">禁用</button>
                                    </div>
                                </td>
                            </tr>
                            <tr class="hover:bg-slate-50/50">
                                <td class="px-6 py-4 flex items-center gap-3">
                                    <div class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 font-bold text-xs">O</div>
                                    <div>
                                        <p class="font-bold text-slate-800">op_chen</p>
                                        <p class="text-xs text-slate-400">chen.y@company.com</p>
                                    </div>
                                </td>
                                <td class="px-4 py-4">
                                    <span class="px-2.5 py-1 bg-amber-50 text-amber-600 text-[11px] font-bold rounded-lg border border-amber-100">运营人员</span>
                                </td>
                                <td class="px-4 py-4">
                                    <span class="inline-flex items-center gap-1.5 text-emerald-600 font-bold text-xs">
                                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                                        正常
                                    </span>
                                </td>
                                <td class="px-4 py-4 text-right">
                                    <div class="flex items-center justify-end gap-4">
                                        <button class="text-blue-600 hover:text-blue-800 font-bold">编辑</button>
                                        <button class="text-rose-500 hover:text-rose-700 font-bold">禁用</button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 角色权限内容 -->
            <div id="tab-roles" class="tab-content space-y-6">
                <div class="grid grid-cols-12 gap-6">
                    <!-- 角色选择列表 -->
                    <div class="col-span-3 space-y-2">
                        <button class="w-full p-4 bg-blue-600 text-white rounded-2xl flex items-center justify-between group shadow-lg shadow-blue-500/20">
                            <span class="font-bold">系统管理员</span>
                            <i data-lucide="chevron-right" size="16"></i>
                        </button>
                        <button class="w-full p-4 bg-white border border-slate-200 text-slate-600 rounded-2xl flex items-center justify-between hover:bg-slate-50 transition-all">
                            <span class="font-bold">运营人员</span>
                            <i data-lucide="chevron-right" size="16"></i>
                        </button>
                        <button class="w-full p-4 bg-white border border-slate-200 text-slate-600 rounded-2xl flex items-center justify-between hover:bg-slate-50 transition-all">
                            <span class="font-bold">普通用户</span>
                            <i data-lucide="chevron-right" size="16"></i>
                        </button>
                        <button class="w-full p-3 border border-dashed border-slate-300 rounded-2xl text-slate-400 text-xs font-bold hover:bg-white flex items-center justify-center gap-2">
                            <i data-lucide="plus" size="14"></i>
                            创建自定义角色
                        </button>
                    </div>

                    <!-- 权限详情配置 -->
                    <div class="col-span-9 bg-white border border-slate-200 rounded-2xl p-8 shadow-sm">
                        <div class="flex items-center justify-between mb-8 pb-4 border-b border-slate-100">
                            <div>
                                <h3 class="font-bold text-slate-800 text-lg">系统管理员 - 权限配置</h3>
                                <p class="text-xs text-slate-400 mt-1">拥有系统所有功能的完全控制权</p>
                            </div>
                            <button class="bg-slate-900 text-white px-6 py-2 rounded-xl text-sm font-bold">保存修改</button>
                        </div>

                        <div class="space-y-8">
                            <!-- 权限组 1 -->
                            <div class="space-y-4">
                                <div class="flex items-center gap-2 text-blue-600">
                                    <i data-lucide="database" size="16"></i>
                                    <h4 class="text-sm font-bold uppercase tracking-wider">知识库管理权限</h4>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <label class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100 cursor-pointer hover:border-blue-200 transition-all">
                                        <div class="flex flex-col">
                                            <span class="text-sm font-bold text-slate-700">查看知识库</span>
                                            <span class="text-[10px] text-slate-400">允许浏览所有知识库及其内容</span>
                                        </div>
                                        <input type="checkbox" checked class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                    </label>
                                    <label class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100 cursor-pointer hover:border-blue-200 transition-all">
                                        <div class="flex flex-col">
                                            <span class="text-sm font-bold text-slate-700">编辑知识条目</span>
                                            <span class="text-[10px] text-slate-400">新增、修改或删除知识库内容</span>
                                        </div>
                                        <input type="checkbox" checked class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                                    </label>
                                </div>
                            </div>

                            <!-- 权限组 2 -->
                            <div class="space-y-4">
                                <div class="flex items-center gap-2 text-rose-600">
                                    <i data-lucide="alert-triangle" size="16"></i>
                                    <h4 class="text-sm font-bold uppercase tracking-wider">Bad Case 监控权限</h4>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <label class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100">
                                        <span class="text-sm font-bold text-slate-700">查看并分析案例</span>
                                        <input type="checkbox" checked class="w-4 h-4 rounded border-slate-300 text-blue-600">
                                    </label>
                                    <label class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100">
                                        <span class="text-sm font-bold text-slate-700">处理/忽略案例</span>
                                        <input type="checkbox" checked class="w-4 h-4 rounded border-slate-300 text-blue-600">
                                    </label>
                                </div>
                            </div>

                            <!-- 权限组 3 -->
                            <div class="space-y-4">
                                <div class="flex items-center gap-2 text-slate-800">
                                    <i data-lucide="shield" size="16"></i>
                                    <h4 class="text-sm font-bold uppercase tracking-wider">系统设置权限</h4>
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <label class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100">
                                        <span class="text-sm font-bold text-slate-700">角色与权限配置</span>
                                        <input type="checkbox" checked class="w-4 h-4 rounded border-slate-300 text-blue-600">
                                    </label>
                                    <label class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100">
                                        <span class="text-sm font-bold text-slate-700">用户账号管理</span>
                                        <input type="checkbox" checked class="w-4 h-4 rounded border-slate-300 text-blue-600">
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        lucide.createIcons();

        function switchTab(tabId) {
            // 切换标签页内容
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');

            // 切换按钮样式
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + tabId).classList.add('active');
        }
    </script>
</body>
</html>
