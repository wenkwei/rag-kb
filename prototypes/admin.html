<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 知识库管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 沉稳的科技感背景 */
        .login-bg {
            background-color: #1e293b;
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.05) 1px, transparent 0);
            background-size: 40px 40px;
            position: relative;
            overflow: hidden;
        }

        /* 装饰用线条 */
        .bg-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.1), transparent);
            height: 1px;
            width: 100%;
        }

        .line-1 { top: 20%; transform: rotate(-5deg); }
        .line-2 { top: 60%; transform: rotate(3deg); }
        .line-3 { top: 80%; transform: rotate(-2deg); }

        /* 卡片阴影增强 */
        .login-card {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* 输入框聚焦效果 */
        .input-group:focus-within label {
            color: #3b82f6;
        }
    </style>
</head>
<body class="login-bg min-h-screen flex items-center justify-center p-6">

    <!-- 背景装饰线条 -->
    <div class="bg-line line-1"></div>
    <div class="bg-line line-2"></div>
    <div class="bg-line line-3"></div>

    <!-- 登录卡片 -->
    <div class="login-card bg-white w-full max-w-[420px] rounded-2xl overflow-hidden z-10 animate-in fade-in slide-in-from-bottom-4 duration-700">
        
        <!-- 顶部标识区 -->
        <div class="pt-10 pb-6 px-10 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-slate-100 rounded-xl mb-4">
                <!-- 简版 Logo SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">知识库管理系统</h1>
            <p class="text-slate-400 text-sm mt-1 uppercase tracking-widest">Knowledge Base Management</p>
        </div>

        <!-- 登录表单 -->
        <form class="px-10 pb-10 space-y-5">
            
            <!-- 账号输入 -->
            <div class="input-group">
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1 transition-colors">账号</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </span>
                    <input type="text" placeholder="管理员账号" class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-slate-700 bg-slate-50/50" required>
                </div>
            </div>

            <!-- 密码输入 -->
            <div class="input-group">
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1 transition-colors">密码</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </span>
                    <input type="password" placeholder="密码" class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-slate-700 bg-slate-50/50" required>
                </div>
            </div>

            <!-- 附加选项 -->
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center cursor-pointer group">
                    <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                    <span class="ml-2 text-slate-500 group-hover:text-slate-700 transition-colors">记住密码</span>
                </label>
                <a href="#" class="text-blue-600 hover:text-blue-700 font-medium">忘记密码？</a>
            </div>

            <!-- 登录按钮 -->
            <button type="submit" class="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg shadow-lg shadow-slate-200 transition-all active:scale-[0.98] mt-2">
                进入系统
            </button>

            <!-- 二次验证提示 -->
            <div class="flex items-center justify-center gap-2 pt-2 text-[13px] text-slate-400">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                <span>登录可能需要通过手机双重验证</span>
            </div>
        </form>

        <!-- 底部 SSO/LDAP 链接 -->
        <div class="px-10 py-6 bg-slate-50 border-t border-slate-100 text-center">
            <p class="text-sm text-slate-400 mb-3">使用其他方式登录</p>
            <a href="#" class="inline-flex items-center gap-2 px-6 py-2 border border-slate-200 bg-white rounded-full text-sm text-slate-600 font-semibold hover:border-blue-400 hover:text-blue-600 transition-all shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
                </svg>
                企业统一认证 (LDAP / SSO)
            </a>
        </div>
    </div>

    <!-- 页面底部版权信息 -->
    <div class="fixed bottom-6 w-full text-center text-slate-500 text-xs">
        &copy; 2024 某某科技有限公司 - 内部管理系统
    </div>

    <!-- 登录提示弹窗 -->
    <div id="toast" class="hidden fixed top-6 right-6 bg-red-50 border border-red-200 text-red-700 px-5 py-3 rounded-xl shadow-lg text-sm font-medium z-50">
    </div>

    <script>
    const API_BASE = 'http://localhost:8002';

    document.querySelector('form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = this.querySelector('input[type="text"]').value.trim();
        const password = this.querySelector('input[type="password"]').value.trim();
        const btn = this.querySelector('button[type="submit"]');
        const toast = document.getElementById('toast');

        if (!username || !password) {
            showToast('请输入账号和密码');
            return;
        }

        btn.disabled = true;
        btn.textContent = '登录中...';

        try {
            const res = await fetch(`${API_BASE}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });

            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                window.location.href = '/dashboard.html';
            } else {
                showToast(data.detail || '登录失败，请检查账号密码');
            }
        } catch (err) {
            showToast('无法连接到服务器，请确认后端服务已启动');
        } finally {
            btn.disabled = false;
            btn.textContent = '进入系统';
        }
    });

    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.remove('hidden');
        setTimeout(() => el.classList.add('hidden'), 3000);
    }
    </script>

</body>
</html>
