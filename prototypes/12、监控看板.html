<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库核心指标看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', 'Microsoft YaHei', sans-serif;
            background-color: #f1f5f9;
        }
        .card-shadow {
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }
        .trend-up { color: #10b981; }
        .trend-down { color: #f43f5e; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between shrink-0 z-10">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
            </div>
            <h1 class="text-xl font-bold text-slate-800">知识库效能监控看板</h1>
        </div>

        <div class="flex items-center gap-4">
            <div class="flex bg-slate-100 p-1 rounded-lg">
                <button class="px-4 py-1.5 text-xs font-bold rounded-md bg-white shadow-sm text-slate-800">今日</button>
                <button class="px-4 py-1.5 text-xs font-medium text-slate-500 hover:text-slate-700">本周</button>
                <button class="px-4 py-1.5 text-xs font-medium text-slate-500 hover:text-slate-700">本月</button>
                <button class="px-4 py-1.5 text-xs font-medium text-slate-500 hover:text-slate-700 flex items-center gap-1">
                    自定义 <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </button>
            </div>
            <button class="p-2 text-slate-400 hover:text-slate-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-6 space-y-6 custom-scrollbar">
        
        <!-- 第一行：核心指标卡片 -->
        <div class="grid grid-cols-4 gap-6">
            <!-- 自助解决率 -->
            <div class="bg-white p-6 rounded-xl border border-slate-200 card-shadow">
                <div class="flex justify-between items-start">
                    <p class="text-sm font-medium text-slate-500">自助解决率</p>
                    <span class="p-1.5 bg-emerald-50 rounded-lg text-emerald-600">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </span>
                </div>
                <div class="mt-4 flex items-baseline gap-2">
                    <h2 class="text-3xl font-bold text-slate-800">82%</h2>
                    <span class="text-xs font-bold trend-up">↑ 4.2%</span>
                </div>
                <p class="mt-1 text-[10px] text-slate-400 uppercase font-semibold">较昨日同期</p>
            </div>
            <!-- 平均响应时间 -->
            <div class="bg-white p-6 rounded-xl border border-slate-200 card-shadow">
                <div class="flex justify-between items-start">
                    <p class="text-sm font-medium text-slate-500">平均响应时间</p>
                    <span class="p-1.5 bg-blue-50 rounded-lg text-blue-600">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </span>
                </div>
                <div class="mt-4 flex items-baseline gap-2">
                    <h2 class="text-3xl font-bold text-slate-800">2.3<span class="text-lg">s</span></h2>
                    <span class="text-xs font-bold trend-up">↓ 0.5s</span>
                </div>
                <p class="mt-1 text-[10px] text-slate-400 uppercase font-semibold">处理效率提升</p>
            </div>
            <!-- 用户满意度 -->
            <div class="bg-white p-6 rounded-xl border border-slate-200 card-shadow">
                <div class="flex justify-between items-start">
                    <p class="text-sm font-medium text-slate-500">用户满意度</p>
                    <span class="p-1.5 bg-amber-50 rounded-lg text-amber-600">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.382-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg>
                    </span>
                </div>
                <div class="mt-4 flex items-baseline gap-2">
                    <h2 class="text-3xl font-bold text-slate-800">4.6<span class="text-lg">/5</span></h2>
                    <span class="text-xs font-bold trend-down">↓ 0.1</span>
                </div>
                <p class="mt-1 text-[10px] text-slate-400 uppercase font-semibold">基于 1.2k 评价</p>
            </div>
            <!-- 未命中率 -->
            <div class="bg-white p-6 rounded-xl border border-slate-200 card-shadow">
                <div class="flex justify-between items-start">
                    <p class="text-sm font-medium text-slate-500">知识未命中率</p>
                    <span class="p-1.5 bg-rose-50 rounded-lg text-rose-600">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    </span>
                </div>
                <div class="mt-4 flex items-baseline gap-2">
                    <h2 class="text-3xl font-bold text-slate-800">8%</h2>
                    <span class="text-xs font-bold trend-up">↓ 2.1%</span>
                </div>
                <p class="mt-1 text-[10px] text-slate-400 uppercase font-semibold">知识覆盖度提升</p>
            </div>
        </div>

        <!-- 第二行：分布与趋势图 -->
        <div class="grid grid-cols-12 gap-6">
            <!-- 意图分布饼图 -->
            <div class="col-span-4 bg-white p-6 rounded-xl border border-slate-200 card-shadow">
                <h3 class="text-sm font-bold text-slate-700 mb-6">用户意图分布占比</h3>
                <div class="h-64 relative">
                    <canvas id="intentChart"></canvas>
                </div>
            </div>
            <!-- 检索质量折线图 -->
            <div class="col-span-8 bg-white p-6 rounded-xl border border-slate-200 card-shadow">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-sm font-bold text-slate-700">检索质量趋势 (准确率 vs 召回率)</h3>
                    <div class="flex gap-4 text-[10px] font-bold uppercase">
                        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-indigo-500"></span> 准确率</span>
                        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-slate-300"></span> 召回率</span>
                    </div>
                </div>
                <div class="h-64">
                    <canvas id="qualityChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 第三行：未命中 Top 10 与 Bad Case 列表 -->
        <div class="grid grid-cols-12 gap-6">
            <!-- 高频未命中问题 Top 10 -->
            <div class="col-span-7 bg-white p-6 rounded-xl border border-slate-200 card-shadow">
                <h3 class="text-sm font-bold text-slate-700 mb-6">高频未命中问题 Top 10 (热词洞察)</h3>
                <div class="h-80">
                    <canvas id="topMissChart"></canvas>
                </div>
            </div>
            <!-- 最近 Bad Case 列表 -->
            <div class="col-span-5 bg-white rounded-xl border border-slate-200 card-shadow flex flex-col">
                <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                    <h3 class="text-sm font-bold text-slate-700">最近反馈的 Bad Case</h3>
                    <button class="text-xs text-indigo-600 font-bold hover:underline">查看全部</button>
                </div>
                <div class="flex-1 overflow-auto custom-scrollbar">
                    <table class="w-full text-left">
                        <tbody class="divide-y divide-slate-50">
                            <tr class="hover:bg-slate-50 transition-colors cursor-pointer group">
                                <td class="px-6 py-4">
                                    <div class="text-xs font-semibold text-slate-700 line-clamp-1">怎么重置财务系统的两步验证码？</div>
                                    <div class="flex gap-3 mt-1.5">
                                        <span class="text-[10px] text-slate-400">14:20</span>
                                        <span class="text-[10px] text-rose-500 font-bold bg-rose-50 px-1.5 rounded">答案错误</span>
                                    </div>
                                </td>
                                <td class="px-6 py-4 text-right">
                                    <svg class="w-4 h-4 text-slate-300 group-hover:text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                </td>
                            </tr>
                            <tr class="hover:bg-slate-50 transition-colors cursor-pointer group">
                                <td class="px-6 py-4">
                                    <div class="text-xs font-semibold text-slate-700 line-clamp-1">Mac 端的 VPN 连接提示证书已过期</div>
                                    <div class="flex gap-3 mt-1.5">
                                        <span class="text-[10px] text-slate-400">11:05</span>
                                        <span class="text-[10px] text-amber-600 font-bold bg-amber-50 px-1.5 rounded">检索不全</span>
                                    </div>
                                </td>
                                <td class="px-6 py-4 text-right">
                                    <svg class="w-4 h-4 text-slate-300 group-hover:text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                </td>
                            </tr>
                            <tr class="hover:bg-slate-50 transition-colors cursor-pointer group">
                                <td class="px-6 py-4">
                                    <div class="text-xs font-semibold text-slate-700 line-clamp-1">2024年团建的具体行程表</div>
                                    <div class="flex gap-3 mt-1.5">
                                        <span class="text-[10px] text-slate-400">昨天</span>
                                        <span class="text-[10px] text-slate-500 font-bold bg-slate-100 px-1.5 rounded">知识盲区</span>
                                    </div>
                                </td>
                                <td class="px-6 py-4 text-right">
                                    <svg class="w-4 h-4 text-slate-300 group-hover:text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        window.onload = function() {
            // 意图分布饼图
            const intentCtx = document.getElementById('intentChart').getContext('2d');
            new Chart(intentCtx, {
                type: 'doughnut',
                data: {
                    labels: ['产品咨询', '技术报障', '政策查询', '常规闲聊', '其它'],
                    datasets: [{
                        data: [45, 25, 15, 10, 5],
                        backgroundColor: ['#6366f1', '#818cf8', '#a5b4fc', '#c7d2fe', '#e2e8f0'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }
                    },
                    cutout: '70%'
                }
            });

            // 检索质量折线图
            const qualityCtx = document.getElementById('qualityChart').getContext('2d');
            new Chart(qualityCtx, {
                type: 'line',
                data: {
                    labels: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                    datasets: [{
                        label: '准确率',
                        data: [88, 92, 85, 90, 94, 91, 93],
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        fill: true,
                        tension: 0.4
                    }, {
                        label: '召回率',
                        data: [82, 84, 80, 85, 88, 87, 89],
                        borderColor: '#cbd5e1',
                        borderDash: [5, 5],
                        fill: false,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: false, min: 70, grid: { color: '#f1f5f9' }, border: { display: false } },
                        x: { grid: { display: false }, border: { display: false } }
                    }
                }
            });

            // 高频未命中条形图
            const missCtx = document.getElementById('topMissChart').getContext('2d');
            new Chart(missCtx, {
                type: 'bar',
                data: {
                    labels: ['薪资结构', '期权行权', '公积金比例', '补充医疗', '电脑补贴', '报销流程', 'VPN配置', '门禁卡补办', '食堂菜单', '团建方案'],
                    datasets: [{
                        data: [142, 118, 95, 88, 76, 62, 58, 45, 32, 28],
                        backgroundColor: '#6366f1',
                        borderRadius: 4
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#f1f5f9' }, border: { display: false } },
                        y: { grid: { display: false }, border: { display: false } }
                    }
                }
            });
        };
    </script>
</body>
</html>
