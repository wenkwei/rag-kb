<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文档上传与预处理配置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', 'Microsoft YaHei', sans-serif;
            background-color: rgba(15, 23, 42, 0.5); /* 模拟弹窗背景遮罩 */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .modal-shadow {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(0, 0, 0, 0.05);
        }

        .custom-number-input::-webkit-inner-spin-button,
        .custom-number-input::-webkit-outer-spin-button {
            opacity: 1;
        }

        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-processing {
            animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body>

    <!-- 弹窗容器 -->
    <div class="bg-white w-[600px] rounded-2xl overflow-hidden modal-shadow animate-in fade-in zoom-in-95 duration-300">
        
        <!-- 头部 -->
        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
            <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a2 2 0 011.414.586l3.414 3.414a2 2 0 01.586 1.414V17a2 2 0 01-2 2z"></path>
                </svg>
                新增文档并配置预处理
            </h3>
            <button class="text-slate-400 hover:text-slate-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <div class="p-6 space-y-6 max-h-[70vh] overflow-y-auto">
            
            <!-- 上传区域 -->
            <section>
                <div class="border-2 border-dashed border-slate-200 rounded-xl p-8 flex flex-col items-center justify-center bg-slate-50 hover:bg-blue-50/50 hover:border-blue-300 transition-all cursor-pointer group">
                    <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm mb-3 group-hover:scale-110 transition-transform">
                        <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                    </div>
                    <p class="text-sm font-semibold text-slate-700">拖拽或点击上传文件</p>
                    <p class="text-xs text-slate-400 mt-1">支持多文件上传，单个文件不超过 50MB</p>
                </div>
            </section>

            <!-- 已选文件列表 -->
            <section class="space-y-3">
                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">待处理文件 (3)</h4>
                <div class="border border-slate-100 rounded-lg divide-y divide-slate-50">
                    <!-- 文件项 1 -->
                    <div class="flex items-center justify-between p-3 hover:bg-slate-50 transition-colors">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <svg class="w-8 h-8 text-red-500 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"></path></svg>
                            <div class="truncate">
                                <p class="text-sm font-medium text-slate-700 truncate">2024季度财务汇总.pdf</p>
                                <p class="text-[11px] text-slate-400">1.2 MB</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-[11px] font-bold text-slate-400 px-2 py-0.5 bg-slate-100 rounded">待处理</span>
                            <button class="text-slate-300 hover:text-rose-500 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                    <!-- 文件项 2 -->
                    <div class="flex items-center justify-between p-3 hover:bg-slate-50 transition-colors">
                        <div class="flex items-center gap-3 overflow-hidden">
                            <svg class="w-8 h-8 text-blue-500 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"></path></svg>
                            <div class="truncate">
                                <p class="text-sm font-medium text-slate-700 truncate">技术选型方案说明.docx</p>
                                <p class="text-[11px] text-slate-400">450 KB</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="text-[11px] font-bold text-blue-600 px-2 py-0.5 bg-blue-50 rounded animate-processing">读取中...</span>
                            <button class="text-slate-300 hover:text-rose-500 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 预处理参数设置 (可折叠) -->
            <section class="border border-slate-200 rounded-xl overflow-hidden">
                <button class="w-full px-4 py-3 bg-slate-50 flex items-center justify-between group">
                    <span class="text-sm font-bold text-slate-700 flex items-center gap-2">
                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        预处理参数设置
                    </span>
                    <svg class="w-4 h-4 text-slate-400 group-hover:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div class="p-4 bg-white space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label class="text-xs text-slate-500 font-medium">分块大小 (Chunk Size)</label>
                            <input type="number" value="512" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all custom-number-input">
                        </div>
                        <div class="space-y-1">
                            <label class="text-xs text-slate-500 font-medium">重叠大小 (Overlap)</label>
                            <input type="number" value="50" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all custom-number-input">
                        </div>
                    </div>
                    
                    <div class="pt-2">
                        <label class="flex items-center justify-between cursor-pointer group">
                            <div class="flex flex-col">
                                <span class="text-sm font-semibold text-slate-700 group-hover:text-blue-600 transition-colors">自动提取元数据</span>
                                <span class="text-xs text-slate-400">提取标题、作者、日期等信息并存入索引</span>
                            </div>
                            <div class="relative inline-flex items-center h-6 rounded-full w-11 bg-blue-600 transition-colors">
                                <span class="inline-block w-4 h-4 transform translate-x-6 bg-white rounded-full transition-transform shadow-sm"></span>
                            </div>
                        </label>
                    </div>
                </div>
            </section>
        </div>

        <!-- 底部按钮 -->
        <div class="px-6 py-4 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-3">
            <button class="px-6 py-2 text-sm font-bold text-slate-500 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition-all">
                取消
            </button>
            <button class="px-8 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-lg shadow-lg shadow-blue-200 transition-all active:scale-95">
                开始处理
            </button>
        </div>
    </div>

</body>
</html>
