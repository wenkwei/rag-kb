<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业知识库 - 登录</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .animate-fade-in-down {
            animation: fadeInDown 0.5s ease-out;
        }

        @keyframes fadeInDown {
            0% { opacity: 0; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 自定义加载动画 */
        .loader {
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center bg-slate-50 relative overflow-hidden">
    
    <!-- 背景装饰 -->
    <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-blue-100 rounded-full blur-[120px] opacity-40"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-indigo-100 rounded-full blur-[120px] opacity-40"></div>

    <div class="relative z-10 w-[420px] bg-white rounded-2xl shadow-[0_20px_60px_rgba(0,0,0,0.06)] p-10 flex flex-col items-center">
        
        <!-- 顶部 Logo -->
        <div class="mb-8 text-center">
            <div class="w-14 h-14 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-100">
                <i data-lucide="building-2" class="text-white w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">企业知识库</h1>
            <p class="text-slate-400 text-sm mt-1">Enterprise Knowledge Base</p>
        </div>

        <!-- AI 助手横幅 (默认隐藏) -->
        <div id="aiBanner" class="hidden w-full mb-6 p-3 bg-blue-50 rounded-lg border border-blue-100 flex items-start gap-3 animate-fade-in-down">
            <i data-lucide="sparkles" class="text-blue-500 shrink-0 mt-0.5 w-4 h-4"></i>
            <p id="aiText" class="text-xs text-blue-700 leading-relaxed"></p>
        </div>

        <!-- 登录表单 -->
        <form id="loginForm" class="w-full space-y-4">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                    <i data-lucide="user" class="w-[18px] h-[18px]"></i>
                </div>
                <input
                    type="text"
                    id="identifier"
                    placeholder="工号 / 邮箱"
                    class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-slate-700"
                    required
                >
            </div>

            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                    <i data-lucide="lock" class="w-[18px] h-[18px]"></i>
                </div>
                <input
                    type="password"
                    id="password"
                    placeholder="密码"
                    class="w-full pl-10 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-slate-700"
                    required
                >
                <button
                    type="button"
                    onclick="togglePassword()"
                    class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600"
                >
                    <i id="eyeIcon" data-lucide="eye" class="w-[18px] h-[18px]"></i>
                </button>
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center space-x-2 cursor-pointer group">
                    <input
                        type="checkbox"
                        class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500"
                    >
                    <span class="text-slate-500 group-hover:text-slate-700 transition-colors">记住密码</span>
                </label>
                <div class="flex gap-3">
                    <button 
                        type="button" 
                        onclick="getAiHelp()"
                        id="aiBtn"
                        class="flex items-center text-blue-600 hover:text-blue-700 font-medium transition-colors gap-1"
                    >
                        <span id="aiBtnIcon"><i data-lucide="sparkles" class="w-[14px] h-[14px]"></i></span>
                        <span>✨ 辅助登录</span>
                    </button>
                </div>
            </div>

            <button
                type="submit"
                class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md shadow-blue-100 active:scale-[0.98] transition-all flex items-center justify-center gap-2"
            >
                立即登录
            </button>
        </form>

        <div class="w-full flex items-center my-8">
            <div class="flex-1 h-[1px] bg-slate-100"></div>
            <span class="px-4 text-[10px] text-slate-400 uppercase tracking-widest">第三方统一认证</span>
            <div class="flex-1 h-[1px] bg-slate-100"></div>
        </div>

        <div class="w-full grid grid-cols-2 gap-4">
            <button class="flex items-center justify-center space-x-2 px-4 py-2.5 border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors text-sm text-slate-600 font-medium">
                <span class="text-blue-500 font-bold">钉</span>
                <span>钉钉登录</span>
            </button>
            <button class="flex items-center justify-center space-x-2 px-4 py-2.5 border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors text-sm text-slate-600 font-medium">
                <span class="text-emerald-500 font-bold">飞</span>
                <span>飞书登录</span>
            </button>
        </div>

        <!-- 底部安全栏 -->
        <div class="mt-10 flex items-center justify-between w-full border-t border-slate-50 pt-6">
            <div class="flex items-center space-x-1.5 text-xs text-slate-400">
                <i data-lucide="shield-check" class="text-emerald-500 w-[14px] h-[14px]"></i>
                <span>全链路加密防护</span>
            </div>
            <button 
                onclick="playSecurityVoice()"
                id="ttsBtn"
                class="flex items-center space-x-1 text-xs text-slate-400 hover:text-blue-500 transition-colors"
            >
                <i data-lucide="volume-2" id="ttsIcon" class="w-[14px] h-[14px]"></i>
                <span>✨ 安全播报</span>
            </button>
        </div>
    </div>

    <div class="absolute bottom-6 w-full text-center text-slate-400 text-[10px] tracking-widest">
        &copy; 2024 ENTERPRISE KNOWLEDGE BASE &middot; INTERNAL USE ONLY
    </div>

    <script>
        // 初始化图标
        lucide.createIcons();

        const apiKey = ""; // 运行时提供

        // 切换密码显示
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                passwordInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // 重试逻辑
        async function fetchWithRetry(url, options, retries = 5, backoff = 1000) {
            try {
                const response = await fetch(url, options);
                if (!response.ok && retries > 0) throw new Error('Fetch failed');
                return response;
            } catch (err) {
                if (retries <= 0) throw err;
                await new Promise(resolve => setTimeout(resolve, backoff));
                return fetchWithRetry(url, options, retries - 1, backoff * 2);
            }
        }

        // AI 辅助登录
        async function getAiHelp() {
            const btn = document.getElementById('aiBtn');
            const btnIcon = document.getElementById('aiBtnIcon');
            const banner = document.getElementById('aiBanner');
            const aiText = document.getElementById('aiText');

            btn.disabled = true;
            btnIcon.innerHTML = '<div class="loader"></div>';

            const systemPrompt = "你是一个企业IT助教。用户在登录知识库时需要帮助。请提供简短、专业且友好的登录提示（50字以内），例如提醒检查工号格式或公司VPN状态。";
            
            try {
                const response = await fetchWithRetry(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: "我无法登录系统，请给我一些快速检查建议。" }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    }
                );
                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                
                banner.classList.remove('hidden');
                aiText.innerText = text || "暂时无法获取建议，请联系管理员。";
            } catch (error) {
                banner.classList.remove('hidden');
                aiText.innerText = "服务连接超时。";
            } finally {
                btn.disabled = false;
                btnIcon.innerHTML = '<i data-lucide="sparkles" class="w-[14px] h-[14px]"></i>';
                lucide.createIcons();
            }
        }

        // 安全播报 (PCM to WAV)
        async function playSecurityVoice() {
            const btn = document.getElementById('ttsBtn');
            const icon = document.getElementById('ttsIcon');
            
            btn.disabled = true;
            icon.classList.add('animate-pulse', 'text-blue-500');

            const text = "安全提醒：请勿将密码透露给他人，确保在受信任的设备上登录企业知识库。";

            try {
                const response = await fetchWithRetry(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Say calmly: ${text}` }] }],
                            generationConfig: { 
                                responseModalities: ["AUDIO"],
                                speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
                            },
                            model: "gemini-2.5-flash-preview-tts"
                        })
                    }
                );
                const result = await response.json();
                const base64Audio = result.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;

                if (base64Audio) {
                    const audioBlob = await pcmToWav(base64Audio, 24000);
                    const url = URL.createObjectURL(audioBlob);
                    new Audio(url).play();
                }
            } catch (e) {
                console.error(e);
            } finally {
                btn.disabled = false;
                icon.classList.remove('animate-pulse', 'text-blue-500');
            }
        }

        async function pcmToWav(base64Data, sampleRate) {
            const byteCharacters = atob(base64Data);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
            const buffer = new Uint8Array(byteNumbers).buffer;
            const wavHeader = new ArrayBuffer(44);
            const view = new DataView(wavHeader);
            const writeString = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
            writeString(0, 'RIFF');
            view.setUint32(4, 32 + buffer.byteLength, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, buffer.byteLength, true);
            return new Blob([wavHeader, buffer], { type: 'audio/wav' });
        }

        // 登录提交
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const username = document.getElementById('identifier').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = e.target.querySelector('button[type="submit"]');

            if (!username || !password) {
                showToast('请输入工号/邮箱和密码');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '登录中...';

            try {
                const res = await fetch('http://localhost:8002/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password }),
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    window.location.href = '/qa.html';
                } else {
                    showToast(data.detail || '登录失败');
                }
            } catch (err) {
                showToast('无法连接到服务器');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '立即登录';
            }
        };

        function showToast(msg) {
            const el = document.createElement('div');
            el.className = 'fixed top-6 right-6 bg-red-50 border border-red-200 text-red-700 px-5 py-3 rounded-xl shadow-lg text-sm font-medium z-50';
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }
    </script>
</body>
</html>
