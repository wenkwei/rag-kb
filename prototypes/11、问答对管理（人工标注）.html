<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>问答对管理 - 知识库管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', 'Microsoft YaHei', sans-serif;
            background-color: #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        .category-tag {
            background-color: #eff6ff;
            color: #1d4ed8;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- 顶部导航 -->
    <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shrink-0 z-10 shadow-sm">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                标准问答对 (FAQ) 管理
            </h1>
            <nav class="flex items-center gap-2 text-sm text-slate-400 ml-4">
                <span>控制台</span>
                <span>/</span>
                <span class="text-slate-600 font-medium">知识库维护</span>
            </nav>
        </div>
        <div class="flex items-center gap-3">
            <button class="px-4 py-2 bg-blue-50 text-blue-600 border border-blue-100 rounded-lg text-sm font-semibold hover:bg-blue-100 transition-all flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"></path></svg>
                导出 Excel
            </button>
            <button class="px-4 py-2 bg-slate-800 text-white rounded-lg text-sm font-bold flex items-center gap-2 hover:bg-slate-900 transition-all shadow-md">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                新增问答
            </button>
        </div>
    </header>

    <main class="flex-1 overflow-hidden p-6 flex flex-col gap-6">
        
        <!-- 操作与筛选 -->
        <section class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-3 flex-1">
                <!-- 搜索 -->
                <div class="relative w-96">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </span>
                    <input type="text" placeholder="搜索问题或答案关键词..." class="w-full pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-500/20 shadow-sm">
                </div>
                <!-- 分类筛选 -->
                <select class="bg-white border border-slate-200 text-slate-600 text-sm rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500/20 shadow-sm">
                    <option>全部类目</option>
                    <option>公司政策</option>
                    <option>技术支持</option>
                    <option>人力资源</option>
                </select>
            </div>

            <!-- 特色按钮：从 Bad Case 导入 -->
            <button class="px-4 py-2 bg-amber-50 text-amber-700 border border-amber-200 rounded-lg text-sm font-bold hover:bg-amber-100 transition-all flex items-center gap-2 animate-pulse hover:animate-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                从 Bad Case 导入 (3)
            </button>
        </section>

        <!-- 问答列表表格 -->
        <section class="flex-1 bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
            <div class="overflow-auto custom-scrollbar flex-1">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 sticky top-0 z-10 border-b border-slate-200">
                        <tr>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">问题内容</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">答案预览</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider w-32">所属类目</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider w-24 text-center">使用次数</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider w-40">最后更新</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider w-32 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <!-- FAQ Item 1 -->
                        <tr class="hover:bg-slate-50/80 transition-colors">
                            <td class="px-6 py-4">
                                <div class="text-sm font-semibold text-slate-800">公司的带薪年假政策是什么？</div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="text-xs text-slate-500 truncate max-w-xs">入职满一年可享受5天带薪年假，满十年享受10天...</div>
                            </td>
                            <td class="px-6 py-4">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold category-tag">人力资源</span>
                            </td>
                            <td class="px-6 py-4 text-center">
                                <span class="text-xs font-medium text-slate-600">1,204</span>
                            </td>
                            <td class="px-6 py-4 text-xs text-slate-400">2024-03-20 09:15</td>
                            <td class="px-6 py-4 text-right">
                                <div class="flex justify-end gap-3">
                                    <button class="text-blue-600 hover:text-blue-800 text-xs font-bold">编辑</button>
                                    <button class="text-rose-500 hover:text-rose-700 text-xs font-bold">删除</button>
                                </div>
                            </td>
                        </tr>
                        <!-- FAQ Item 2 -->
                        <tr class="hover:bg-slate-50/80 transition-colors">
                            <td class="px-6 py-4">
                                <div class="text-sm font-semibold text-slate-800">如何重置公司邮箱的登录密码？</div>
                            </td>
                            <td class="px-6 py-4">
                                <div class="text-xs text-slate-500 truncate max-w-xs">访问 SSO 统一认证平台，点击“忘记密码”并通过手机验证...</div>
                            </td>
                            <td class="px-6 py-4">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold category-tag">技术支持</span>
                            </td>
                            <td class="px-6 py-4 text-center">
                                <span class="text-xs font-medium text-slate-600">856</span>
                            </td>
                            <td class="px-6 py-4 text-xs text-slate-400">2024-03-18 14:40</td>
                            <td class="px-6 py-4 text-right">
                                <div class="flex justify-end gap-3">
                                    <button class="text-blue-600 hover:text-blue-800 text-xs font-bold">编辑</button>
                                    <button class="text-rose-500 hover:text-rose-700 text-xs font-bold">删除</button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <!-- 分页 -->
            <div class="px-6 py-4 border-t border-slate-100 flex items-center justify-between bg-slate-50">
                <span class="text-xs text-slate-500">共 156 个问答对</span>
                <div class="flex items-center gap-1">
                    <button class="w-8 h-8 flex items-center justify-center rounded bg-blue-600 text-white text-xs font-bold shadow-sm shadow-blue-200">1</button>
                    <button class="w-8 h-8 flex items-center justify-center rounded hover:bg-white border border-transparent hover:border-slate-200 text-slate-600 text-xs font-bold transition-all">2</button>
                    <button class="w-8 h-8 flex items-center justify-center rounded hover:bg-white border border-transparent hover:border-slate-200 text-slate-600 text-xs font-bold transition-all">3</button>
                </div>
            </div>
        </section>
    </main>

    <!-- 新增/编辑模态框 -->
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-12 overflow-hidden">
        <div class="bg-white w-full max-w-4xl h-full rounded-2xl flex flex-col shadow-2xl animate-in zoom-in-95 duration-300">
            <!-- 头部 -->
            <div class="px-8 py-5 border-b border-slate-100 flex items-center justify-between shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    </div>
                    <h3 class="font-bold text-lg text-slate-800">编辑问答内容</h3>
                </div>
                <button class="p-2 hover:bg-slate-100 rounded-full transition-colors">
                    <svg class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <!-- 内容表单 -->
            <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">
                <div class="max-w-3xl mx-auto space-y-8">
                    <!-- 问题 -->
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-2">
                            标准问题内容 <span class="text-rose-500">*</span>
                        </label>
                        <input type="text" value="公司的带薪年假政策是什么？" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-medium outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-400 transition-all">
                    </div>

                    <!-- 分类与标签 -->
                    <div class="grid grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">所属分类</label>
                            <select class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none">
                                <option>人力资源</option>
                                <option>技术支持</option>
                                <option>财务制度</option>
                            </select>
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">关键词标签</label>
                            <input type="text" placeholder="输入标签按回车添加..." class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm outline-none">
                        </div>
                    </div>

                    <!-- 富文本答案 -->
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center justify-between">
                            标准参考答案 <span class="text-[10px] normal-case font-medium text-slate-400 italic">支持富文本编辑</span>
                        </label>
                        <div class="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                            <!-- 模拟富文本工具栏 -->
                            <div class="bg-slate-50 px-3 py-2 border-b border-slate-200 flex gap-2">
                                <button class="p-1.5 hover:bg-white rounded font-bold text-slate-700">B</button>
                                <button class="p-1.5 hover:bg-white rounded italic text-slate-700">I</button>
                                <button class="p-1.5 hover:bg-white rounded underline text-slate-700">U</button>
                                <div class="w-px h-6 bg-slate-200 mx-1"></div>
                                <button class="p-1.5 hover:bg-white rounded"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12.586 4.586a2 2 0 112.828 2.828l-3 3a2 2 0 01-2.828 0 1 1 0 00-1.414 1.414 4 4 0 005.656 0l3-3a4 4 0 00-5.656-5.656l-1.5 1.5a1 1 0 101.414 1.414l1.5-1.5zm-5 5a2 2 0 012.828 0 1 1 0 101.414-1.414 4 4 0 00-5.656 0l-3 3a4 4 0 105.656 5.656l1.5-1.5a1 1 0 10-1.414-1.414l-1.5 1.5a2 2 0 11-2.828-2.828l3-3z" clip-rule="evenodd"></path></svg></button>
                                <button class="p-1.5 hover:bg-white rounded"><svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd"></path></svg></button>
                            </div>
                            <textarea class="w-full h-48 p-4 bg-white text-sm text-slate-700 outline-none leading-relaxed" placeholder="在此输入标准回答内容...">根据公司最新政策，全体员工入职满一年即可享受带薪年假：
1. 入职 1-10 年：年假 5 天
2. 入职 10-20 年：年假 10 天
3. 入职 20 年以上：年假 15 天

请至少提前一周在企业办公系统中提交申请。</textarea>
                        </div>
                    </div>

                    <!-- 关联文档 -->
                    <div class="space-y-3">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">关联支撑文档 (可选)</label>
                        <div class="flex items-center gap-3">
                            <div class="flex-1 flex items-center gap-3 px-4 py-2 bg-slate-100 rounded-lg text-sm text-slate-600 border border-slate-200">
                                <svg class="w-4 h-4 text-rose-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd"></path></svg>
                                <span>员工考勤管理手册_2024修订版.pdf</span>
                                <button class="ml-auto text-slate-400 hover:text-rose-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                            </div>
                            <button class="px-4 py-2 border border-slate-200 rounded-lg text-xs font-bold text-slate-600 hover:bg-slate-50 transition-all">添加文档</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 底部操作 -->
            <div class="px-8 py-5 border-t border-slate-100 flex justify-end gap-3 shrink-0">
                <button class="px-6 py-2.5 text-sm font-bold text-slate-500 hover:bg-slate-50 rounded-xl transition-all">放弃修改</button>
                <button class="px-10 py-2.5 bg-blue-600 text-white text-sm font-bold rounded-xl hover:bg-blue-700 transition-all shadow-lg shadow-blue-100">保存问答</button>
            </div>
        </div>
    </div>

</body>
</html>
