        <div class="p-6 border-t border-slate-700">
            <div class="flex items-center p-3 bg-slate-800 rounded-xl">
                <div class="w-8 h-8 rounded-full bg-blue-500 overflow-hidden mr-3 flex items-center justify-center text-white text-xs font-bold" id="avatar-text">A</div>
                <div class="flex-1 overflow-hidden">
                    <p class="text-xs font-bold text-white truncate" id="sidebar-username">管理员</p>
                    <p class="text-[10px] text-slate-400">超级管理员</p>
                </div>
                <button onclick="logout()" class="text-slate-400 hover:text-white transition-colors p-1 ml-2 shrink-0" title="退出登录">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>

    <!-- 主内容区 -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white border-b border-slate-200 px-8 py-3 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
                <h1 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                    问答评测
                </h1>
                <span class="px-2 py-0.5 bg-indigo-50 text-indigo-600 text-[10px] font-bold rounded uppercase">Benchmark</span>
            </div>
            <div class="flex items-center gap-3">
                <span id="header-username" class="text-sm text-slate-500"></span>
                <button onclick="logout()" class="text-sm text-slate-400 hover:text-red-500">退出</button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8 custom-scrollbar">
            <div class="max-w-6xl mx-auto space-y-6">

                <!-- 评测概览指标 -->
                <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-xs font-bold text-slate-400 uppercase">测试集</span>
                        </div>
                        <p class="text-2xl font-bold text-slate-800">45</p>
                        <p class="text-[10px] text-slate-400">个测试问题</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-xs font-bold text-slate-400 uppercase">召回率</span>
                        </div>
                        <p class="text-2xl font-bold text-emerald-600" id="metric-recall">87.3%</p>
                        <p class="text-[10px] text-slate-400">Recall@4</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-xs font-bold text-slate-400 uppercase">命中率</span>
                        </div>
                        <p class="text-2xl font-bold text-blue-600" id="metric-hit">92.1%</p>
                        <p class="text-[10px] text-slate-400">Hit Rate</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-xs font-bold text-slate-400 uppercase">MRR</span>
                        </div>
                        <p class="text-2xl font-bold text-indigo-600" id="metric-mrr">0.834</p>
                        <p class="text-[10px] text-slate-400">Mean Reciprocal Rank</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-xs font-bold text-slate-400 uppercase">NDCG</span>
                        </div>
                        <p class="text-2xl font-bold text-amber-600" id="metric-ndcg">0.791</p>
                        <p class="text-[10px] text-slate-400">@4</p>
                    </div>
                </div>

                <!-- 操作栏 -->
                <div class="flex items-center justify-between gap-4 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <div class="flex items-center gap-3">
                        <select id="config-select" class="px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm text-slate-600 outline-none">
                            <option value="default">默认配置 (TopK=4, 阈值=0.6)</option>
                            <option value="config-a">配置A (TopK=6, 阈值=0.5)</option>
                            <option value="config-b">配置B (TopK=3, 阈值=0.7)</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="runEvaluation()" id="eval-btn" class="px-5 py-2 bg-indigo-600 text-white text-sm font-bold rounded-lg hover:bg-indigo-700 shadow-lg shadow-indigo-100 flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            运行评测
                        </button>
                    </div>
                </div>

                <!-- 评测结果详情 -->
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="px-6 py-4 border-b border-slate-100 bg-slate-50 flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                            <h3 class="text-sm font-bold text-slate-700">各问题详细评测结果</h3>
                        </div>
                        <span class="text-xs text-slate-400">按召回率排序</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-white border-b border-slate-100">
                                <tr>
                                    <th class="px-6 py-3 text-xs font-bold text-slate-500 uppercase">#</th>
                                    <th class="px-6 py-3 text-xs font-bold text-slate-500 uppercase">测试问题</th>
                                    <th class="px-6 py-3 text-xs font-bold text-slate-500 uppercase">预期答案</th>
                                    <th class="px-6 py-3 text-xs font-bold text-slate-500 uppercase">命中</th>
                                    <th class="px-6 py-3 text-xs font-bold text-slate-500 uppercase">召回率</th>
                                    <th class="px-6 py-3 text-xs font-bold text-slate-500 uppercase">操作</th>
                                </tr>
                            </thead>
                            <tbody id="eval-result-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        const API_BASE = 'http://localhost:8002';
        const token = localStorage.getItem('auth_token');
        if (!token) window.location.href = 'admin-login.html';

        const username = localStorage.getItem('auth_username') || '管理员';
        document.getElementById('sidebar-username').textContent = username;
        document.getElementById('header-username').textContent = username;
        document.getElementById('avatar-text').textContent = username.charAt(0).toUpperCase();

        function authToken() { return localStorage.getItem('auth_token'); }

        // ===== 测试数据集 =====
        const testSet = [
            { id: 'q1', question: '2024年Q3的市场预期是多少？', expected: '2024年Q3市场预期增长率约为5.8%，主要受新兴市场拉动。' },
            { id: 'q2', question: '产品的退款政策是什么？', expected: '用户可在购买后7天内申请无理由退款，超过7天需联系客服审核。' },
            { id: 'q3', question: '如何重置管理员密码？', expected: '管理员可在登录页点击"忘记密码"，通过绑定的邮箱接收重置链接。' },
            { id: 'q4', question: '系统支持哪些文件格式上传？', expected: '支持 PDF、DOCX、TXT、Markdown 格式，单个文件不超过50MB。' },
            { id: 'q5', question: '数据同步频率可以设置吗？', expected: '支持手动同步和自动定时同步，自动同步频率可设置为每1小时、6小时、12小时或每天。' },
        ];

        let evalResults = [];

        function runEvaluation() {
            const btn = document.getElementById('eval-btn');
            btn.disabled = true;
            btn.innerHTML = '<div class="loader" style="border:2px solid #e0e7ff;border-top:2px solid #fff;border-radius:50%;width:14px;height:14px;animation:spin 1s linear infinite;display:inline-block;margin-right:8px"></div> 评测中...';

            // 模拟评测执行
            setTimeout(() => {
                evalResults = testSet.map((q, i) => {
                    const hit = Math.random() > 0.15;
                    const recall = hit ? 0.7 + Math.random() * 0.3 : 0.1 + Math.random() * 0.3;
                    return {
                        ...q,
                        hit,
                        recall: Math.round(recall * 1000) / 1000,
                    };
                });
                updateMetrics();
                renderResults();
                btn.disabled = false;
                btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg> 运行评测';
            }, 1500);
        }

        function updateMetrics() {
            const total = evalResults.length;
            if (!total) return;
            const hits = evalResults.filter(r => r.hit).length;
            const avgRecall = evalResults.reduce((s, r) => s + r.recall, 0) / total;
            // 模拟 MRR / NDCG
            const mrr = evalResults.reduce((s, r) => s + (r.hit ? 0.7 + Math.random() * 0.3 : 0.1), 0) / total;
            const ndcg = evalResults.reduce((s, r) => s + (r.hit ? 0.6 + Math.random() * 0.35 : 0.1), 0) / total;

            document.getElementById('metric-recall').textContent = (avgRecall * 100).toFixed(1) + '%';
            document.getElementById('metric-hit').textContent = (hits / total * 100).toFixed(1) + '%';
            document.getElementById('metric-mrr').textContent = mrr.toFixed(3);
            document.getElementById('metric-ndcg').textContent = ndcg.toFixed(3);
        }

        function renderResults() {
            const tbody = document.getElementById('eval-result-body');
            if (!evalResults.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-12 text-center text-sm text-slate-400">点击"运行评测"开始测试</td></tr>';
                return;
            }
            tbody.innerHTML = evalResults.map((r, i) => `
                <tr class="hover:bg-slate-50/50 transition-colors">
                    <td class="px-6 py-3 text-sm text-slate-400 font-mono">${i + 1}</td>
                    <td class="px-6 py-3 text-sm font-medium text-slate-700 max-w-[200px] truncate">${r.question}</td>
                    <td class="px-6 py-3 text-sm text-slate-500 max-w-[200px] truncate">${r.expected}</td>
                    <td class="px-6 py-3">
                        ${r.hit
                            ? '<span class="inline-flex items-center gap-1 text-xs text-emerald-600 font-bold"><svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg> 是</span>'
                            : '<span class="inline-flex items-center gap-1 text-xs text-rose-500 font-medium"><svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg> 否</span>'}
                    </td>
                    <td class="px-6 py-3">
                        <div class="flex items-center gap-2">
                            <div class="w-16 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                                <div class="h-full rounded-full ${r.recall >= 0.7 ? 'bg-emerald-500' : r.recall >= 0.4 ? 'bg-amber-500' : 'bg-rose-500'}" style="width:${r.recall * 100}%"></div>
                            </div>
                            <span class="text-xs font-bold text-slate-600 w-12">${(r.recall * 100).toFixed(0)}%</span>
                        </div>
                    </td>
                    <td class="px-6 py-3">
                        <button onclick="viewDetail(${i})" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">查看详情</button>
                    </td>
                </tr>
            `).join('');
        }

        function viewDetail(index) {
            const r = evalResults[index];
            if (!r) return;
            alert(`问题: ${r.question}\n预期答案: ${r.expected}\n命中: ${r.hit ? '是' : '否'}\n召回率: ${(r.recall * 100).toFixed(0)}%`);
        }

        function logout() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('auth_username');
            window.location.href = 'admin-login.html';
        }

        // 初始空状态
        renderResults();
    </script>
