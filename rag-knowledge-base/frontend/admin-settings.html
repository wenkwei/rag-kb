<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库管理系统 - 系统配置</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', 'Microsoft YaHei', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .sidebar-active { background-color: rgba(255,255,255,0.1); border-left: 4px solid #3498DB; }
        .config-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- 侧边栏 -->
    <aside class="w-64 bg-[#2C3E50] text-slate-300 flex flex-col shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-slate-700">
            <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center mr-3">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            </div>
            <span class="text-white font-bold tracking-tight">知识库管理系统</span>
        </div>
        <nav class="flex-1 py-6 space-y-1 overflow-y-auto">
            <a href="admin-dashboard.html" class="flex items-center px-6 py-3 hover:bg-slate-700/50 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-sm font-medium">仪表盘</span>
            </a>
            <a href="admin-knowledge.html" class="flex items-center px-6 py-3 hover:bg-slate-700/50 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path></svg>
                <span class="text-sm font-medium">知识库管理</span>
            </a>
            <a href="admin-search-test.html" class="flex items-center px-6 py-3 hover:bg-slate-700/50 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <span class="text-sm font-medium">检索测试</span>
            </a>
            <a href="admin-badcase.html" class="flex items-center px-6 py-3 hover:bg-slate-700/50 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <span class="text-sm font-medium">Bad Case</span>
            </a>
            <a href="admin-monitor.html" class="flex items-center px-6 py-3 hover:bg-slate-700/50 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <span class="text-sm font-medium">监控看板</span>
            </a>
            <div class="pt-4 pb-2 px-6 text-[10px] font-bold text-slate-500 uppercase">系统设置</div>
            <a href="admin-settings.html" class="flex items-center px-6 py-3 text-white sidebar-active">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="text-sm font-medium">系统配置</span>
            </a>
            <a href="admin-users.html" class="flex items-center px-6 py-3 hover:bg-slate-700/50 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span class="text-sm font-medium">用户管理</span>
            </a>
                    <div class="pt-4 pb-2 px-6 text-[10px] font-bold text-slate-500 uppercase border-t border-slate-700 mt-4">账户</div>
            <a href="#" onclick="logout()" class="flex items-center px-6 py-3 hover:bg-slate-700/50 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                <span class="text-sm font-medium">退出</span>
            </a>
        </nav>
        <div class="p-6 border-t border-slate-700">
            <div class="flex items-center p-3 bg-slate-800 rounded-xl">
                <div class="w-8 h-8 rounded-full bg-blue-500 overflow-hidden mr-3 flex items-center justify-center text-white text-xs font-bold" id="avatar-text">A</div>
                <div class="flex-1 overflow-hidden">
                    <p class="text-xs font-bold text-white truncate" id="sidebar-username">管理员</p>
                    <p class="text-[10px] text-slate-400">超级管理员</p>
                </div>
            </div>
        </div>
    </aside>

    <!-- 主内容区 -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-3">
                <div>
                    <h1 class="text-lg font-bold text-slate-800">RAG 核心参数配置</h1>
                    <p class="text-[10px] text-slate-400 font-medium uppercase">Engine Configuration & Tuning</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span id="header-username" class="text-sm text-slate-500"></span>
                <button onclick="logout()" class="text-sm text-slate-400 hover:text-red-500">退出</button>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8 custom-scrollbar">
            <div class="max-w-5xl mx-auto space-y-6 pb-24">

                <!-- 文档分块策略 -->
                <section class="bg-white p-6 rounded-xl border border-slate-200">
                    <div class="flex items-center gap-2 mb-6">
                        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                        <h2 class="text-base font-bold text-slate-800">文档分块策略 (Chunking Strategy)</h2>
                    </div>
                    <div class="grid grid-cols-2 gap-8">
                        <div class="space-y-4">
                            <div class="flex justify-between">
                                <label class="text-sm font-semibold text-slate-700">分块大小 (Chunk Size)</label>
                                <span class="text-xs font-mono text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded" id="val-chunk-size">500</span>
                            </div>
                            <input type="range" min="200" max="1000" value="500" step="10" class="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-indigo-600" oninput="document.getElementById('val-chunk-size').innerText = this.value">
                            <p class="text-xs text-slate-400">单个文本分块包含的最大 Token 数量</p>
                        </div>
                        <div class="space-y-4">
                            <div class="flex justify-between">
                                <label class="text-sm font-semibold text-slate-700">重叠大小 (Overlap)</label>
                                <span class="text-xs font-mono text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded" id="val-overlap">50</span>
                            </div>
                            <input type="range" min="0" max="200" value="50" step="5" class="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-indigo-600" oninput="document.getElementById('val-overlap').innerText = this.value">
                            <p class="text-xs text-slate-400">相邻分块之间重复的内容大小，保持语义连续</p>
                        </div>
                    </div>
                </section>

                <!-- 向量化与检索 -->
                <div class="grid grid-cols-2 gap-6">
                    <section class="bg-white p-6 rounded-xl border border-slate-200">
                        <div class="flex items-center gap-2 mb-6">
                            <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            <h2 class="text-base font-bold text-slate-800">向量化配置</h2>
                        </div>
                        <div class="space-y-5">
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-slate-500 uppercase">Embedding 模型</label>
                                <input type="text" value="text-embedding-3-small" disabled class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-500 cursor-not-allowed">
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-slate-500 uppercase">OpenAI 密钥状态</label>
                                <div class="flex items-center gap-2 p-3 rounded-lg border" id="key-status">
                                    <span class="w-2 h-2 rounded-full" id="key-dot"></span>
                                    <span class="text-xs font-medium" id="key-text">检测中...</span>
                                </div>
                            </div>
                        </div>
                    </section>
                    <section class="bg-white p-6 rounded-xl border border-slate-200">
                        <div class="flex items-center gap-2 mb-6">
                            <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            <h2 class="text-base font-bold text-slate-800">检索参数</h2>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-slate-500 uppercase">Top K</label>
                                <input type="number" id="config-topk" min="1" max="20" value="4" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm">
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-slate-500 uppercase">Temperature</label>
                                <input type="number" id="config-temp" min="0" max="2" step="0.1" value="0" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm">
                            </div>
                        </div>
                    </section>
                </div>

                <!-- 保存 -->
                <div class="bg-white p-6 rounded-xl border border-slate-200 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-slate-300"></span>
                        <span class="text-xs text-slate-400">配置保存在后端环境变量中，修改后需重启服务</span>
                    </div>
                    <button onclick="saveConfig()" class="px-8 py-2.5 bg-indigo-600 text-white text-sm font-bold rounded-xl hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-100">保存配置</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = 'http://localhost:8002';
        const token = localStorage.getItem('auth_token');
        if (!token) window.location.href = 'admin-login.html';

        const username = localStorage.getItem('auth_username') || '管理员';
        document.getElementById('sidebar-username').textContent = username;
        document.getElementById('header-username').textContent = username;
        document.getElementById('avatar-text').textContent = username.charAt(0).toUpperCase();

        function authToken() { return localStorage.getItem('auth_token'); }

        async function loadConfig() {
            try {
                const res = await fetch(`${API_BASE}/api/config`, {
                    headers: { 'Authorization': `Bearer ${authToken()}` }
                });
                if (res.status === 401) { localStorage.removeItem('auth_token'); window.location.href = 'admin-login.html'; return; }
                const config = await res.json();
                document.getElementById('val-chunk-size').textContent = config.chunk_size || 500;
                document.querySelector('input[type="range"][min="200"]').value = config.chunk_size || 500;
                document.getElementById('val-overlap').textContent = config.chunk_overlap || 50;
                document.querySelector('input[type="range"][min="0"]').value = config.chunk_overlap || 50;
                document.getElementById('config-topk').value = config.top_k || 4;
                document.getElementById('config-temp').value = config.temperature || 0;

                // Update key status
                const keyStatus = document.getElementById('key-status');
                const keyDot = document.getElementById('key-dot');
                const keyText = document.getElementById('key-text');
                if (config.openai_key_configured) {
                    keyStatus.className = 'flex items-center gap-2 p-3 rounded-lg border bg-emerald-50 border-emerald-100';
                    keyDot.className = 'w-2 h-2 bg-emerald-500 rounded-full';
                    keyText.className = 'text-xs text-emerald-700 font-medium';
                    keyText.textContent = '已配置';
                } else {
                    keyStatus.className = 'flex items-center gap-2 p-3 rounded-lg border bg-rose-50 border-rose-100';
                    keyDot.className = 'w-2 h-2 bg-rose-500 rounded-full';
                    keyText.className = 'text-xs text-rose-700 font-medium';
                    keyText.textContent = '未配置';
                }
            } catch (e) {}
        }

        async function saveConfig() {
            const data = {
                chunk_size: parseInt(document.querySelector('input[type="range"][min="200"]').value),
                chunk_overlap: parseInt(document.querySelector('input[type="range"][min="0"]').value),
                top_k: parseInt(document.getElementById('config-topk').value),
                temperature: parseFloat(document.getElementById('config-temp').value),
            };
            try {
                const res = await fetch(`${API_BASE}/api/config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken()}` },
                    body: JSON.stringify(data),
                });
                if (res.status === 401) { localStorage.removeItem('auth_token'); window.location.href = 'admin-login.html'; return; }
                const result = await res.json();
                alert(result.message || '配置已保存');
            } catch (e) {
                alert('保存失败，请检查后端服务是否运行');
            }
        }

        function logout() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('auth_username');
            window.location.href = 'admin-login.html';
        }

        document.addEventListener('DOMContentLoaded', loadConfig);
    </script>
</body>
</html>
