                category: '答案错误',
                wrong_answer: '请检查您的手机信号是否正常，或者尝试重启手机后重新获取验证码。',
                expected_answer: '企业微信收不到验证码的常见原因及解决办法：1）检查是否开启了短信拦截功能，请查看拦截记录；2）确认手机号是否为在公司HR系统登记的号码，如已更换请联系IT服务台更新；3）获取验证码的频率不要超过60秒/次，频繁获取会触发风控限制；4）如以上方法均无效，请通过企业微信「设置」->「帮助与反馈」联系技术支持，或拨打IT服务台（分机：8899）。',
                time: '2024-03-19 08:55',
                status: 'pending',
                feedback: '手机信号没问题，重启了也没用',
                sources: [
                    { name: '企业微信常见问题.docx', chunk: 6, score: 0.42 },
                    { name: 'IT服务台知识库_2024.xlsx', chunk: 18, score: 0.36 },
                ]
            },
        ];

        let allBadCases = [];

        function loadDemoData() {
            allBadCases = DEMO_BAD_CASES;
            updateStats();
            renderTable();
        }

        async function loadBadCases() {
            try {
                const [casesRes, statsRes] = await Promise.all([
                    fetch(`${API_BASE}/api/badcases`, { headers: { 'Authorization': `Bearer ${authToken()}` } }),
                    fetch(`${API_BASE}/api/badcases/stats`, { headers: { 'Authorization': `Bearer ${authToken()}` } }),
                ]);
                if (casesRes.status === 401) { localStorage.removeItem('auth_token'); window.location.href = 'admin-login.html'; return; }

                const casesData = await casesRes.json();
                const stats = await statsRes.json();
                let cases = casesData.bad_cases || [];

                // 如果后端返回空数据，使用 demo 数据
                if (!cases.length) {
                    loadDemoData();
                    return;
                }

                allBadCases = cases.map(c => ({
                    ...c,
                    category: c.category || '未分类',
                    wrong_answer: c.wrong_answer || '',
                    expected_answer: c.expected_answer || '',
                    sources: c.sources || [],
                }));

                document.getElementById('stat-pending').textContent = stats.pending || 0;
                document.getElementById('stat-resolved').textContent = stats.resolved || 0;
                document.getElementById('stat-today').textContent = stats.today || 0;
                document.getElementById('stat-rate').textContent = (stats.resolution_rate || 0) + '%';
                document.getElementById('stat-categories').textContent = stats.categories || '-';

                renderTable();
            } catch (e) {
                // 后端不可用时加载 demo 数据
                loadDemoData();
            }
        }

        function updateStats() {
            const pending = allBadCases.filter(c => c.status === 'pending').length;
            const resolved = allBadCases.filter(c => c.status === 'resolved').length;
            const total = allBadCases.length;
            const rate = total ? Math.round(resolved / total * 100) : 0;
            document.getElementById('stat-pending').textContent = pending;
            document.getElementById('stat-resolved').textContent = resolved;
            document.getElementById('stat-today').textContent = allBadCases.filter(c => c.time && c.time.startsWith('2024-03-21')).length;
            document.getElementById('stat-rate').textContent = rate + '%';

            const cats = [...new Set(allBadCases.map(c => c.category))];
            document.getElementById('stat-categories').textContent = cats.join(' / ');
        }

        function filterCases() {
            renderTable();
        }

        function renderTable() {
            const search = (document.getElementById('search-input').value || '').toLowerCase();
            const statusFilter = document.getElementById('status-filter').value;
            const catFilter = document.getElementById('category-filter').value;

            const filtered = allBadCases.filter(c => {
                if (statusFilter !== 'all' && c.status !== statusFilter) return false;
                if (catFilter !== 'all' && c.category !== catFilter) return false;
                if (search && !c.question.toLowerCase().includes(search)) return false;
                return true;
            });

            const tbody = document.getElementById('badcase-body');
            if (!filtered.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-12 text-center text-sm text-slate-400">暂无匹配的 Bad Case 记录</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(c => {
                const catColor = {
                    '检索遗漏': 'bg-amber-50 text-amber-600',
                    '答案错误': 'bg-red-50 text-red-600',
                    '逻辑混淆': 'bg-purple-50 text-purple-600',
                    '格式异常': 'bg-blue-50 text-blue-600',
                }[c.category] || 'bg-slate-50 text-slate-600';

                return `
                    <tr class="hover:bg-slate-50 transition-colors cursor-pointer" onclick="toggleDetail('${c.id}')">
                        <td class="px-2 py-4 text-center">
                            <svg class="w-4 h-4 text-slate-300 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </td>
                        <td class="px-4 py-4">
                            <div class="text-sm font-medium text-slate-700 truncate max-w-md">${c.question}</div>
                            ${c.feedback ? `<div class="text-[11px] text-slate-400 mt-0.5 truncate max-w-md">用户反馈：${c.feedback}</div>` : ''}
                        </td>
                        <td class="px-4 py-4">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${catColor}">${c.category || '未分类'}</span>
                        </td>
                        <td class="px-4 py-4 text-xs text-slate-500">${c.time || '-'}</td>
                        <td class="px-4 py-4 text-center">
                            <span class="px-2 py-1 rounded-full text-[10px] font-bold uppercase ${c.status === 'pending' ? 'status-pill-pending' : 'status-pill-resolved'}">
                                ${c.status === 'pending' ? '待处理' : '已处理'}
                            </span>
                        </td>
                        <td class="px-4 py-4 text-right">
                            ${c.status === 'pending'
                                ? `<button onclick="event.stopPropagation();markResolved('${c.id}')" class="text-emerald-600 hover:text-emerald-800 text-xs font-bold">标记处理</button>`
                                : `<span class="text-xs text-slate-300">已处理</span>`
                            }
                        </td>
                    </tr>
                    <!-- 展开详情行 -->
                    <tr id="detail-${c.id}" class="hidden bg-slate-50/50">
                        <td colspan="6" class="px-8 py-4 border-b border-slate-100">
                            <div class="grid grid-cols-2 gap-4">
                                <div class="space-y-3">
                                    <div class="bg-red-50 rounded-xl p-4 border border-red-100">
                                        <h4 class="text-[10px] font-bold text-red-500 uppercase mb-2 flex items-center gap-1">
                                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                            系统回答（错误）
                                        </h4>
                                        <p class="text-xs text-slate-600 leading-relaxed">${c.wrong_answer || '（无记录）'}</p>
                                    </div>
                                    <div class="bg-emerald-50 rounded-xl p-4 border border-emerald-100">
                                        <h4 class="text-[10px] font-bold text-emerald-600 uppercase mb-2 flex items-center gap-1">
                                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                                            期望正确回答
                                        </h4>
                                        <p class="text-xs text-slate-600 leading-relaxed">${c.expected_answer || '（待补充）'}</p>
                                    </div>
                                </div>
                                <div class="space-y-3">
                                    <div class="bg-white rounded-xl p-4 border border-slate-200">
                                        <h4 class="text-[10px] font-bold text-slate-500 uppercase mb-3 flex items-center gap-1">
                                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                            相关命中文档
                                        </h4>
                                        ${(c.sources || []).length
                                            ? c.sources.map(s => `
                                                <div class="flex items-center justify-between py-2 border-b border-slate-50 last:border-0">
                                                    <div class="flex items-center gap-2 min-w-0">
                                                        <span class="w-1.5 h-1.5 rounded-full ${s.score >= 0.6 ? 'bg-emerald-400' : s.score >= 0.4 ? 'bg-amber-400' : 'bg-red-400'} shrink-0"></span>
                                                        <span class="text-xs text-slate-600 truncate">${s.name}</span>
                                                    </div>
                                                    <span class="text-[10px] font-mono text-slate-400 shrink-0 ml-2">Chunk ${s.chunk} | ${s.score.toFixed(2)}</span>
                                                </div>
                                            `).join('')
                                            : '<p class="text-xs text-slate-400">无相关文档</p>'
                                        }
                                    </div>
                                    <div class="bg-amber-50 rounded-xl p-4 border border-amber-100">
                                        <h4 class="text-[10px] font-bold text-amber-600 uppercase mb-2 flex items-center gap-1">
                                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path></svg>
                                            用户反馈
                                        </h4>
                                        <p class="text-xs text-slate-600 italic">"${c.feedback || '（未提供反馈）'}"</p>
                                    </div>
                                    <div class="flex gap-2 pt-1">
                                        <button onclick="event.stopPropagation();openDetailPanel('${c.id}')" class="flex-1 px-3 py-2 bg-white border border-slate-200 text-slate-600 text-[10px] font-bold rounded-lg hover:bg-slate-50 transition-colors text-center">
                                            查看完整详情
                                        </button>
                                        ${c.status === 'pending'
                                            ? `<button onclick="event.stopPropagation();markResolved('${c.id}')" class="flex-1 px-3 py-2 bg-emerald-600 text-white text-[10px] font-bold rounded-lg hover:bg-emerald-700 transition-colors text-center">标记已处理</button>`
                                            : ''
                                        }
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function toggleDetail(caseId) {
            const row = document.getElementById('detail-' + caseId);
            const isHidden = row.classList.contains('hidden');
            // 收起其他展开的行
            document.querySelectorAll('[id^="detail-"]').forEach(r => r.classList.add('hidden'));
            if (isHidden) row.classList.remove('hidden');
        }

        function openDetailPanel(caseId) {
            const c = allBadCases.find(item => item.id === caseId);
            if (!c) return;

            const catColor = {
                '检索遗漏': 'bg-amber-50 text-amber-600',
                '答案错误': 'bg-red-50 text-red-600',
                '逻辑混淆': 'bg-purple-50 text-purple-600',
                '格式异常': 'bg-blue-50 text-blue-600',
            }[c.category] || 'bg-slate-50 text-slate-600';

            document.getElementById('detail-content').innerHTML = `
                <div class="space-y-2">
                    <div class="flex items-center gap-2">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${catColor}">${c.category || '未分类'}</span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase ${c.status === 'pending' ? 'status-pill-pending' : 'status-pill-resolved'}">${c.status === 'pending' ? '待处理' : '已处理'}</span>
                    </div>
                    <h4 class="text-lg font-bold text-slate-800">${c.question}</h4>
                    <p class="text-xs text-slate-400">${c.time || ''}</p>
                </div>

                <div class="bg-red-50 rounded-xl p-5 border border-red-100">
                    <h5 class="text-xs font-bold text-red-500 flex items-center gap-2 mb-3">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        系统回答（错误答案）
                    </h5>
                    <p class="text-sm text-slate-700 leading-relaxed">${c.wrong_answer || '（无记录）'}</p>
                </div>

                <div class="bg-emerald-50 rounded-xl p-5 border border-emerald-100">
                    <h5 class="text-xs font-bold text-emerald-600 flex items-center gap-2 mb-3">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        期望正确回答
                    </h5>
                    <p class="text-sm text-slate-700 leading-relaxed">${c.expected_answer || '（待补充）'}</p>
                </div>

                <div class="bg-white rounded-xl p-5 border border-slate-200">
                    <h5 class="text-xs font-bold text-slate-500 flex items-center gap-2 mb-3">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        检索命中文档
                    </h5>
                    <div class="space-y-2">
                        ${(c.sources || []).map(s => `
                            <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg">
                                <div class="flex items-center gap-3 min-w-0">
                                    <span class="w-2 h-2 rounded-full ${s.score >= 0.6 ? 'bg-emerald-400' : s.score >= 0.4 ? 'bg-amber-400' : 'bg-red-400'} shrink-0"></span>
                                    <span class="text-sm text-slate-700 truncate">${s.name}</span>
                                </div>
                                <span class="text-xs font-mono text-slate-400 shrink-0 ml-2">Chunk ${s.chunk} | 相似度 ${(s.score * 100).toFixed(0)}%</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="bg-amber-50 rounded-xl p-5 border border-amber-100">
                    <h5 class="text-xs font-bold text-amber-600 flex items-center gap-2 mb-3">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path></svg>
                        用户反馈
                    </h5>
                    <p class="text-sm text-slate-700 italic">"${c.feedback || '（未提供反馈）'}"</p>
                </div>

                <div class="flex gap-3 pt-2">
                    ${c.status === 'pending'
                        ? `<button onclick="markResolved('${c.id}');closeDetail()" class="flex-1 py-3 bg-emerald-600 text-white text-xs font-bold rounded-xl hover:bg-emerald-700 transition-colors">标记为已处理</button>`
                        : ''
                    }
                    <button onclick="closeDetail()" class="flex-1 py-3 bg-white border border-slate-200 text-slate-600 text-xs font-bold rounded-xl hover:bg-slate-50 transition-colors">关闭</button>
                </div>
            `;
            document.getElementById('detail-panel').classList.remove('hidden');
        }

        function closeDetail() {
            document.getElementById('detail-panel').classList.add('hidden');
        }

        async function markResolved(caseId) {
            // 先尝试后端
            if (caseId && !caseId.startsWith('demo-')) {
                try {
                    const res = await fetch(`${API_BASE}/api/badcases/${caseId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken()}` },
                        body: JSON.stringify({ status: 'resolved' }),
                    });
                    if (res.ok) { loadBadCases(); return; }
                } catch (e) {}
            }
            // 后端不可用或 demo 数据，本地处理
            const idx = allBadCases.findIndex(c => c.id === caseId);
            if (idx !== -1) {
                allBadCases[idx].status = 'resolved';
                updateStats();
                renderTable();
            }
            closeDetail();
        }

        function exportCases() {
            const rows = [['问题', '分类', '系统回答', '期望回答', '时间', '状态', '反馈']];
            allBadCases.forEach(c => {
                rows.push([c.question, c.category, c.wrong_answer, c.expected_answer, c.time,
                    c.status === 'pending' ? '待处理' : '已处理', c.feedback || ''
                ]);
            });
            const csv = rows.map(r => r.map(v => '"' + (v || '').replace(/"/g, '""') + '"').join(',')).join('\n');
            const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'badcase_export_' + new Date().toISOString().slice(0, 10) + '.csv';
            a.click();
        }

        function logout() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('auth_username');
            window.location.href = 'admin-login.html';
        }

        document.addEventListener('DOMContentLoaded', loadBadCases);
    </script>
</body>
</html>
