<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库管理系统 - 知识库管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', 'Microsoft YaHei', sans-serif; background-color: #F4F7F9; color: #34495E; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .sidebar-active { background-color: rgba(255,255,255,0.1); border-left: 4px solid #3498DB; }
        .upload-dragover { border-color: #3b82f6 !important; background-color: #eff6ff !important; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- 侧边栏 -->
    <aside class="w-64 bg-[#2C3E50] text-slate-300 flex flex-col shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-slate-700">
            <div class="w-8 h-8 bg-blue-500 rounded-lg flex items-center justify-center mr-3">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
            </div>
            <span class="text-white font-bold tracking-tight">知识库管理系统</span>
        </div>

        <nav class="flex-1 py-6 space-y-1 overflow-y-auto">
            <a href="admin-dashboard.html" class="flex items-center px-6 py-3 hover:bg-slate-700/50 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-sm font-medium">仪表盘</span>
            </a>
            <a href="admin-knowledge.html" class="flex items-center px-6 py-3 text-white sidebar-active">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path></svg>
                <span class="text-sm font-medium">知识库管理</span>
            </a>
            <a href="admin-search-test.html" class="flex items-center px-6 py-3 hover:bg-slate-700/50 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <span class="text-sm font-medium">检索测试</span>
            </a>
            <a href="admin-badcase.html" class="flex items-center px-6 py-3 hover:bg-slate-700/50 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <span class="text-sm font-medium">Bad Case</span>
            </a>
            <a href="admin-monitor.html" class="flex items-center px-6 py-3 hover:bg-slate-700/50 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                <span class="text-sm font-medium">监控看板</span>
            </a>
            <div class="pt-4 pb-2 px-6 text-[10px] font-bold text-slate-500 uppercase">系统设置</div>
            <a href="admin-settings.html" class="flex items-center px-6 py-3 hover:bg-slate-700/50 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span class="text-sm font-medium">系统配置</span>
            </a>
            <a href="admin-users.html" class="flex items-center px-6 py-3 hover:bg-slate-700/50 hover:text-white transition-colors">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span class="text-sm font-medium">用户管理</span>
            </a>
        </nav>

        <div class="p-6 border-t border-slate-700">
            <div class="flex items-center p-3 bg-slate-800 rounded-xl">
                <div class="w-8 h-8 rounded-full bg-blue-500 overflow-hidden mr-3 flex items-center justify-center text-white text-xs font-bold" id="avatar-text">A</div>
                <div class="flex-1 overflow-hidden">
                    <p class="text-xs font-bold text-white truncate" id="sidebar-username">管理员</p>
                    <p class="text-[10px] text-slate-400">超级管理员</p>
                </div>
                <button onclick="logout()" class="text-slate-400 hover:text-white" title="退出登录">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </div>
    </aside>

    <!-- 主内容区 -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

        <!-- 顶部导航 -->
        <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-4">
                <nav class="flex text-sm text-slate-500" aria-label="Breadcrumb">
                    <ol class="inline-flex items-center space-x-1 md:space-x-3">
                        <li class="inline-flex items-center">
                            <a href="admin-dashboard.html" class="hover:text-slate-800 flex items-center gap-1">
                                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
                                仪表盘
                            </a>
                        </li>
                        <li aria-current="page">
                            <div class="flex items-center">
                                <svg class="w-6 h-6 text-slate-300" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path></svg>
                                <span class="ml-1 font-semibold text-slate-800">知识库管理</span>
                            </div>
                        </li>
                    </ol>
                </nav>
            </div>
            <div class="flex items-center gap-3">
                <span id="header-username" class="text-sm text-slate-500"></span>
                <button onclick="logout()" class="text-sm text-slate-400 hover:text-red-500 transition-colors">退出</button>
            </div>
        </header>

        <!-- 内容区 -->
        <div class="flex-1 flex flex-col min-w-0 bg-white">
            <!-- 上传区域 -->
            <div class="px-6 pt-4 pb-2">
                <div id="upload-zone" class="border-2 border-dashed border-slate-300 rounded-xl p-8 flex flex-col items-center justify-center bg-white hover:border-blue-400 hover:bg-blue-50/30 transition-all cursor-pointer group">
                    <svg class="w-10 h-10 text-slate-400 group-hover:text-blue-500 mb-2 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                    <p class="text-sm font-medium text-slate-600">点击或将文件拖拽至此处上传</p>
                    <p class="text-xs text-slate-400 mt-1">支持 PDF, TXT (单个文件最大 50MB)</p>
                    <input id="file-input" type="file" accept=".pdf,.txt" class="hidden" multiple>
                </div>
                <div id="upload-status" class="hidden mt-3"></div>
            </div>

            <!-- 文档列表标题 -->
            <div class="px-6 py-3 border-b border-slate-100 flex items-center justify-between">
                <h2 class="text-base font-bold text-slate-800">文档列表</h2>
                <span id="doc-count-badge" class="text-xs text-slate-400 bg-slate-100 px-2 py-1 rounded-full">共 0 个文档</span>
            </div>

            <!-- 文档列表 -->
            <div class="flex-1 overflow-auto custom-scrollbar">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 sticky top-0 shadow-[0_1px_0_rgba(0,0,0,0.05)]">
                        <tr>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">文档名称</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">类型</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">切片数</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">状态</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="doc-list-body" class="divide-y divide-slate-100">
                        <tr id="empty-row">
                            <td colspan="5" class="px-6 py-12 text-center text-sm text-slate-400">暂无文档，请上传 PDF 或 TXT 文件</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div id="delete-modal" class="fixed inset-0 bg-black/30 items-center justify-center z-50" style="display:none">
        <div class="bg-white rounded-2xl p-6 w-96 shadow-xl">
            <h3 class="text-lg font-bold text-slate-800 mb-2">确认删除</h3>
            <p class="text-sm text-slate-600 mb-6">确定要删除 <span id="delete-filename" class="font-bold text-slate-800"></span> 吗？此操作不可撤销。</p>
            <div class="flex justify-end gap-3">
                <button onclick="closeDeleteModal()" class="px-4 py-2 text-sm font-bold text-slate-500 hover:bg-slate-100 rounded-lg transition-all">取消</button>
                <button id="confirm-delete-btn" class="px-4 py-2 text-sm font-bold text-white bg-red-500 hover:bg-red-600 rounded-lg transition-all">删除</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8002';

        const token = localStorage.getItem('auth_token');
        if (!token) {
            window.location.href = 'admin-login.html';
        }

        const username = localStorage.getItem('auth_username') || '管理员';
        document.getElementById('sidebar-username').textContent = username;
        document.getElementById('header-username').textContent = username;
        document.getElementById('avatar-text').textContent = username.charAt(0).toUpperCase();

        function authToken() {
            return localStorage.getItem('auth_token');
        }

        let deleteTarget = null;

        // Upload zone
        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');

        uploadZone.addEventListener('click', () => fileInput.click());

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('upload-dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('upload-dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('upload-dragover');
            const files = e.dataTransfer.files;
            if (files.length) uploadFiles(files);
        });

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) uploadFiles(fileInput.files);
        });

        async function uploadFiles(files) {
            const statusDiv = document.getElementById('upload-status');
            statusDiv.classList.remove('hidden');

            for (const file of files) {
                const ext = file.name.split('.').pop().toLowerCase();
                if (!['pdf', 'txt'].includes(ext)) {
                    statusDiv.innerHTML += `<div class="text-sm text-red-500">❌ ${file.name}: 不支持的文件格式</div>`;
                    continue;
                }

                statusDiv.innerHTML += `<div class="text-sm text-slate-600" id="status-${file.name}">⏳ ${file.name}: 上传处理中...</div>`;

                try {
                    const formData = new FormData();
                    formData.append('file', file);

                    const res = await fetch(`${API_BASE}/api/documents/upload`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${authToken()}` },
                        body: formData,
                    });

                    const data = await res.json();
                    const statusEl = document.getElementById(`status-${file.name}`);

                    if (res.ok) {
                        statusEl.className = 'text-sm text-emerald-600';
                        statusEl.textContent = `✅ ${file.name}: 处理完成 (${data.chunk_count} 个切片)`;
                    } else {
                        statusEl.className = 'text-sm text-red-500';
                        statusEl.textContent = `❌ ${file.name}: ${data.detail || '上传失败'}`;
                    }
                } catch (e) {
                    const statusEl = document.getElementById(`status-${file.name}`);
                    if (statusEl) {
                        statusEl.className = 'text-sm text-red-500';
                        statusEl.textContent = `❌ ${file.name}: 网络错误`;
                    }
                }
            }

            setTimeout(loadDocuments, 1000);
        }

        const DEMO_DOCUMENTS = [
            { filename: '财务报销制度2024修订版.pdf', chunk_count: 24 },
            { filename: '新员工入职IT指引.pdf', chunk_count: 18 },
            { filename: '考勤管理制度V3.pdf', chunk_count: 31 },
            { filename: '企业微信常见问题FAQ.txt', chunk_count: 12 },
            { filename: '员工福利手册2024版.pdf', chunk_count: 27 },
            { filename: '公司差旅报销标准.pdf', chunk_count: 16 },
            { filename: 'VPN远程接入指南.txt', chunk_count: 8 },
            { filename: '信息安全管理办法.pdf', chunk_count: 22 },
            { filename: '上海分公司报销比例调整公告.txt', chunk_count: 5 },
            { filename: '劳动人事争议处理流程.pdf', chunk_count: 14 },
        ];

        async function loadDocuments() {
            // 立即显示演示数据
            renderDocumentList(DEMO_DOCUMENTS);
            // 后台尝试从API加载真实数据
            try {
                const res = await fetch(`${API_BASE}/api/documents`, {
                    headers: { 'Authorization': `Bearer ${authToken()}` },
                });
                if (res.status === 401) return;
                const data = await res.json();
                const docs = data.documents || [];
                if (docs.length > 0) renderDocumentList(docs);
            } catch (e) {}
        }

        function renderDocumentList(docs) {
            const tbody = document.getElementById('doc-list-body');
            const badge = document.getElementById('doc-count-badge');
            badge.textContent = `共 ${docs.length} 个文档`;

            if (docs.length === 0) {
                tbody.innerHTML = `<tr id="empty-row"><td colspan="5" class="px-6 py-12 text-center text-sm text-slate-400">暂无文档，请上传 PDF 或 TXT 文件</td></tr>`;
                return;
            }

            tbody.innerHTML = docs.map(doc => {
                const ext = doc.filename.split('.').pop().toLowerCase();
                const isPdf = ext === 'pdf';
                const iconColor = isPdf ? 'text-red-500 bg-red-50' : 'text-blue-500 bg-blue-50';
                const typeLabel = isPdf ? 'PDF' : 'TXT';

                return `
                    <tr class="hover:bg-slate-50 transition-colors group">
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-3">
                                <div class="p-2 ${iconColor} rounded-lg">
                                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"></path></svg>
                                </div>
                                <span class="text-sm font-semibold text-slate-700 group-hover:text-blue-600">${doc.filename}</span>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-0.5 text-xs font-bold ${isPdf ? 'text-red-600 bg-red-50' : 'text-blue-600 bg-blue-50'} rounded">${typeLabel}</span>
                        </td>
                        <td class="px-6 py-4 text-sm text-slate-500">${doc.chunk_count} 个切片</td>
                        <td class="px-6 py-4">
                            <span class="px-2 py-1 rounded-full bg-emerald-50 text-emerald-600 text-[11px] font-bold border border-emerald-100">已索引</span>
                        </td>
                        <td class="px-6 py-4">
                            <button onclick="confirmDelete('${doc.filename}')" class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-md transition-all" title="删除">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function confirmDelete(filename) {
            deleteTarget = filename;
            document.getElementById('delete-filename').textContent = filename;
            document.getElementById('delete-modal').style.display = 'flex';
        }

        function closeDeleteModal() {
            deleteTarget = null;
            document.getElementById('delete-modal').style.display = 'none';
        }

        document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
            if (!deleteTarget) return;
            try {
                const res = await fetch(`${API_BASE}/api/documents/${encodeURIComponent(deleteTarget)}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken()}` },
                });
                if (res.ok) {
                    closeDeleteModal();
                    loadDocuments();
                } else {
                    const err = await res.json();
                    alert(`删除失败: ${err.detail}`);
                    closeDeleteModal();
                }
            } catch (e) {
                alert('删除失败: 网络错误');
                closeDeleteModal();
            }
        });

        function logout() {
            localStorage.removeItem('auth_token');
            localStorage.removeItem('auth_username');
            window.location.href = 'admin-login.html';
        }

        document.addEventListener('DOMContentLoaded', loadDocuments);
    </script>
</body>
</html>
